<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查驗紀錄站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f5f7; }
        
        /* 月檢視樣式 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(60px, 1fr)); gap: 1px; background-color: #e5e7eb; min-width: 100%; }
        .calendar-cell { background-color: white; min-height: 100px; padding: 4px; transition: background-color 0.2s; cursor: pointer; }
        .calendar-cell:hover { background-color: #f9fafb; }
        .calendar-cell.other-month { background-color: #f9fafb; color: #9ca3af; }
        .calendar-cell.today { background-color: #eff6ff; }
        
        /* 週檢視樣式 */
        .week-header-grid { display: grid; grid-template-columns: 50px repeat(7, minmax(135px, 1fr)); gap: 1px; min-width: 1000px; }
        .week-body-grid { display: grid; grid-template-columns: 50px repeat(7, minmax(135px, 1fr)); gap: 1px; background-color: #e5e7eb; min-width: 1000px; }
        .time-axis-cell { background-color: white; height: 60px; text-align: center; font-size: 0.70rem; color: #6b7280; padding-top: 4px; border-bottom: 1px solid #f3f4f6; }
        .week-day-col { background-color: white; position: relative; min-width: 135px; }
        .hour-slot { height: 60px; border-bottom: 1px dashed #e5e7eb; box-sizing: border-box; }
        
        /* 紀錄標籤 */
        .event-badge { font-size: 0.7rem; padding: 2px 4px; border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.1s; margin-bottom: 2px; white-space: nowrap; }
        .event-badge:hover { transform: scale(1.02); z-index: 50 !important; }
        
        /* 隱藏卷軸 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-5 bg-blue-600 text-white flex justify-between items-center shrink-0">
            <h2 class="text-xl font-bold">查驗紀錄站</h2>
            <button onclick="toggleSidebar()" class="text-white hover:text-gray-200 focus:outline-none">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3">
            <button onclick="setMode('add')" class="w-full text-left p-3 rounded-lg flex items-center space-x-3 transition-colors bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200">
                <i class="fas fa-plus-circle w-5"></i>
                <span class="font-medium text-sm">1 廠商登錄查驗</span>
            </button>
            <button onclick="setMode('edit')" class="w-full text-left p-3 rounded-lg flex items-center space-x-3 transition-colors hover:bg-orange-50 text-gray-700 hover:text-orange-700 border border-transparent hover:border-orange-200">
                <i class="fas fa-edit w-5"></i>
                <span class="font-medium text-sm">2 監造查驗資料登錄/修改</span>
            </button>
            <button onclick="setMode('view')" class="w-full text-left p-3 rounded-lg flex items-center space-x-3 transition-colors hover:bg-green-50 text-gray-700 hover:text-green-700 border border-transparent hover:border-green-200">
                <i class="fas fa-list-alt w-5"></i>
                <span class="font-medium text-sm">3 查驗紀錄總覽</span>
            </button>
        </div>
        
        <!-- 手動更新與狀態區塊 -->
        <div class="p-4 border-t bg-gray-50 shrink-0">
            <div class="flex flex-col space-y-2">
                <div class="text-xs text-gray-500 flex items-center justify-between">
                    <span><i class="fas fa-history mr-1"></i>最後同步</span>
                    <span id="syncTimeText" class="text-gray-700 font-semibold">尚未同步</span>
                </div>
                <button type="button" id="btnManualSync" onclick="fetchDataFromCloud(true)" class="w-full bg-white border border-gray-300 text-gray-700 text-sm font-semibold py-2 rounded-lg shadow-sm hover:bg-gray-100 focus:outline-none flex justify-center items-center transition-colors">
                    <i class="fas fa-sync-alt mr-2" id="syncIcon"></i> 雲端手動更新
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col h-full relative">
        <!-- Header -->
        <header id="mainHeader" class="bg-blue-600 text-white shadow-md py-2 px-3 z-10 transition-colors duration-300">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div class="flex items-center space-x-2">
                    <button onclick="toggleSidebar()" class="p-1.5 rounded-md hover:bg-black hover:bg-opacity-20 focus:outline-none shrink-0">
                        <i class="fas fa-bars text-lg"></i>
                    </button>
                    <div class="flex flex-col">
                        <h1 class="text-sm sm:text-base font-bold leading-tight">查驗紀錄站</h1>
                        <div id="modeIndicator" class="text-[10px] sm:text-xs bg-white bg-opacity-20 rounded px-1.5 py-0.5 mt-0.5 whitespace-nowrap inline-block">目前模式: 廠商登錄查驗</div>
                    </div>
                </div>
                
                <div class="flex items-center space-x-2 shrink-0 self-end sm:self-auto">
                    <div class="bg-white bg-opacity-20 rounded-lg p-0.5 flex">
                        <button onclick="switchView('month')" id="btnMonthView" class="px-2.5 py-1 rounded-md text-xs font-medium bg-white text-blue-600 shadow-sm transition-colors">月</button>
                        <button onclick="switchView('week')" id="btnWeekView" class="px-2.5 py-1 rounded-md text-xs font-medium text-white hover:bg-white hover:bg-opacity-20 transition-colors">週</button>
                    </div>
                    
                    <div class="flex items-center bg-white bg-opacity-20 rounded-lg px-1">
                        <button onclick="changeDateOffset(-1)" class="p-1 hover:bg-black hover:bg-opacity-20 rounded-full focus:outline-none"><i class="fas fa-chevron-left text-xs px-1"></i></button>
                        <span id="currentMonthLabel" class="font-bold min-w-[70px] text-center text-xs">2026年 9月</span>
                        <button onclick="changeDateOffset(1)" class="p-1 hover:bg-black hover:bg-opacity-20 rounded-full focus:outline-none"><i class="fas fa-chevron-right text-xs px-1"></i></button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Calendar Container -->
        <div id="calendarContainer" class="flex-1 overflow-x-auto bg-white flex flex-col">
            <!-- Calendar grid injected dynamically -->
        </div>
        
        <!-- Cloud Sync Status Indicator -->
        <div id="syncStatus" class="absolute bottom-2 left-1/2 transform -translate-x-1/2 text-xs bg-black bg-opacity-70 text-white px-3 py-1.5 rounded-full flex items-center space-x-2 z-10 hidden shadow-lg">
            <i class="fas fa-cloud-download-alt"></i>
            <span id="syncStatusMsg">已同步雲端</span>
        </div>
    </div>

    <!-- Data Entry / Edit Modal -->
    <div id="dataModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-center items-center p-3 sm:p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-full flex flex-col overflow-hidden relative">
            <div id="modalHeader" class="bg-blue-600 text-white p-3 sm:p-4 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-base sm:text-lg" id="modalTitle">登錄查驗</h3>
                <button onclick="closeModal()" class="text-white hover:text-gray-200 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-3 sm:p-4 overflow-y-auto flex-1 text-sm">
                <form id="recordForm" class="space-y-4">
                    <input type="hidden" id="recordId">
                    <input type="hidden" id="isFromCloud" value="false">
                    <input type="hidden" id="oldFolderName" value="">
                    
                    <div id="editBadgeContainer" class="flex justify-end hidden"></div>

                    <!-- A. 查驗日期 -->
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">A. 查驗日期 (必選) <span class="text-red-500">*</span></label>
                        <select id="fieldA_select" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500 focus:ring focus:ring-blue-200 bg-white" onchange="handleDateSelectChange()">
                            <option value="">請選擇</option>
                            <option value="tomorrow">明天</option>
                            <option value="custom">日期選擇...</option>
                            <option value="today">今天</option>
                        </select>
                        <div id="fieldA_custom_container" class="mt-2 hidden">
                            <input type="date" id="fieldA_date" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500">
                        </div>
                    </div>

                    <!-- B. 查驗時間 -->
                    <div id="fieldB_container">
                        <label class="block font-semibold text-gray-700 mb-1">B. 查驗時間 (必選) <span class="text-red-500">*</span></label>
                        <div class="flex space-x-2">
                            <input type="time" id="fieldB_time" class="flex-1 border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500">
                            <button type="button" id="btnNow" onclick="setNowTime()" class="px-3 py-2 bg-gray-100 border border-gray-300 rounded-md hover:bg-gray-200 text-sm font-medium whitespace-nowrap shadow-sm">現在時間</button>
                        </div>
                    </div>

                    <!-- C. 查驗項目 -->
                    <div id="fieldC_container">
                        <label class="block font-semibold text-gray-700 mb-1">C. 查驗項目 (必填) <span class="text-red-500">*</span></label>
                        <input type="text" id="fieldC_item" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500" placeholder="填寫查驗項目">
                    </div>

                    <!-- D. 查驗地點 -->
                    <div id="fieldD_container">
                        <label class="block font-semibold text-gray-700 mb-1">D. 查驗地點 (選填)</label>
                        <input type="text" id="fieldD_location" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500" placeholder="填寫查驗地點">
                    </div>

                    <!-- E. 查驗照片 -->
                    <div id="fieldE_container">
                        <label class="block font-semibold text-gray-700 mb-1">E. 查驗照片 <span class="text-xs text-gray-500 font-normal">(選填，最多十張，單張最大500KB)</span></label>
                        
                        <!-- 水印設定區塊 -->
                        <div class="flex items-center justify-between mb-2 bg-gray-50 p-2 rounded-md border border-gray-200 gap-2">
                            <div class="flex items-center">
                                <input type="checkbox" id="watermarkCheckbox" onchange="toggleWatermark()" class="w-4 h-4 text-blue-600 bg-white border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                                <label for="watermarkCheckbox" class="ml-2 text-xs font-semibold text-gray-700 cursor-pointer whitespace-nowrap">加上日期浮水印</label>
                            </div>
                            <div class="flex space-x-1 shrink-0">
                                <input type="date" id="watermarkDate" class="w-28 border-gray-300 rounded-md shadow-sm px-1 py-1 text-xs border focus:border-blue-500 disabled:opacity-50 disabled:bg-gray-200" disabled>
                                <button type="button" id="btnWatermarkToday" onclick="setWatermarkToday()" class="px-2 py-1 bg-white border border-gray-300 rounded-md hover:bg-gray-100 text-xs font-semibold whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed shadow-sm" disabled>今日</button>
                            </div>
                        </div>

                        <input type="file" id="fieldE_photo" accept="image/*" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 disabled:opacity-50" onchange="handlePhotoUpload(event)">
                        <div id="photoPreviewContainer" class="grid grid-cols-3 gap-2 mt-2">
                            <!-- Photos preview appended here -->
                        </div>
                    </div>

                    <!-- F. 施工廠商 -->
                    <div id="fieldF_container">
                        <label class="block font-semibold text-gray-700 mb-1">F. 施工廠商 (名字必填) <span class="text-xs text-red-500 font-normal" id="contractorReqStar">* (需先上傳照片)</span></label>
                        <input type="text" id="fieldF_contractor" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500 disabled:bg-gray-100 disabled:opacity-70" placeholder="填寫廠商名稱">
                    </div>

                    <!-- G. 現場查驗監造 -->
                    <div id="fieldG_container">
                        <label class="block font-semibold text-gray-700 mb-1">G. 現場查驗監造 (名字必填) <span class="text-xs text-red-500 font-normal" id="inspectorReqStar">* (需先上傳照片)</span></label>
                        <input type="text" id="fieldG_inspector" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500 disabled:bg-gray-100 disabled:opacity-70" placeholder="填寫監造名稱">
                    </div>
                </form>
            </div>
            
            <div class="p-3 sm:p-4 border-t bg-gray-50 shrink-0">
                <div id="actionButtonsContainer">
                    <button type="button" onclick="saveRecord()" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none flex justify-center items-center transition-colors">
                        <span id="btnSubmitText">完成上傳</span>
                        <i id="btnSubmitLoader" class="fas fa-circle-notch fa-spin ml-2 hidden"></i>
                    </button>
                </div>
                
                <div id="deleteBtnContainer" class="mt-3 hidden">
                    <button type="button" onclick="deleteRecord()" class="w-full bg-white text-red-600 border border-red-200 font-semibold py-2 rounded-lg shadow-sm hover:bg-red-50 focus:outline-none flex justify-center items-center transition-colors">
                        <i class="fas fa-trash-alt mr-2"></i> 刪除紀錄
                    </button>
                </div>

                <div id="downloadButtonsContainer" class="hidden flex space-x-2">
                    <button type="button" onclick="downloadPhotos()" class="flex-1 bg-white text-blue-600 border border-blue-600 font-bold py-2 rounded-lg hover:bg-blue-50 focus:outline-none text-sm transition-colors">下載照片</button>
                    <button type="button" onclick="downloadRecordText()" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 focus:outline-none text-sm transition-colors">下載紀錄</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Photo Lightbox Viewer -->
    <div id="photoViewerModal" class="fixed inset-0 bg-black bg-opacity-90 z-[100] hidden flex flex-col justify-between items-center p-4">
        <div class="w-full flex justify-between items-center text-white py-2">
            <span id="viewerCounter" class="text-sm font-medium">照片預覽</span>
            <button onclick="closePhotoViewer()" class="text-white hover:text-gray-300 p-2 focus:outline-none">
                <i class="fas fa-times text-2xl"></i>
            </button>
        </div>
        <div class="flex-1 w-full flex items-center justify-center overflow-auto relative">
            <img id="viewerImage" src="" class="max-h-full max-w-full object-contain transition-transform duration-200 cursor-grab" style="transform: scale(1);">
        </div>
        <div class="flex space-x-4 py-3 bg-black bg-opacity-50 px-6 rounded-full text-white">
            <button onclick="zoomViewer(0.25)" class="hover:text-blue-400 focus:outline-none"><i class="fas fa-search-plus text-lg"></i> 放大</button>
            <button onclick="zoomViewer(-0.25)" class="hover:text-blue-400 focus:outline-none"><i class="fas fa-search-minus text-lg"></i> 縮小</button>
            <button onclick="resetZoomViewer()" class="hover:text-blue-400 focus:outline-none"><i class="fas fa-redo text-lg"></i> 還原</button>
        </div>
    </div>

    <!-- Custom Notification Modal (Replaces browser alert/confirm) -->
    <div id="customModal" class="fixed inset-0 bg-black bg-opacity-50 z-[110] hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-5 text-center flex flex-col items-center">
            <div id="customModalIcon" class="text-blue-600 text-3xl mb-3"><i class="fas fa-info-circle"></i></div>
            <p id="customModalMessage" class="text-gray-800 text-base font-medium mb-5">提示訊息</p>
            <div id="customModalButtons" class="flex space-x-3 w-full">
                <button id="customModalOkBtn" onclick="closeCustomModal()" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 focus:outline-none">確定</button>
                <button id="customModalCancelBtn" onclick="closeCustomModal(false)" class="flex-1 bg-gray-200 text-gray-700 font-bold py-2 rounded-lg hover:bg-gray-300 focus:outline-none hidden">取消</button>
            </div>
        </div>
    </div>

    <script type="module">
        let records = [];
        const STORAGE_KEY = 'inspection_records_data';
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzqM6BBjesyyIF7VpA8jhVYVU_Eew81i9ToSw-xMufJXfNjdpxhL9fveUaVq3QeaAAb0g/exec';

        const state = {
            appMode: 'add',
            viewMode: 'month',
            currentDate: new Date()
        };

        const currentPhotos = []; 
        const el = {};
        let viewerScale = 1;

        window.onload = function() {
            cacheDOM();
            loadRecordsFromLocal();
            renderCalendar();
            fetchDataFromCloud(false); 
            
            if (state.appMode === 'add') {
                setTimeout(() => {
                    window.openModal();
                }, 200);
            }
        };

        function cacheDOM() {
            const ids = ['sidebar', 'sidebarOverlay', 'mainHeader', 'modeIndicator', 'currentMonthLabel', 
                         'calendarContainer', 'dataModal', 'modalTitle', 'modalHeader', 'recordForm',
                         'fieldA_select', 'fieldA_custom_container', 'fieldA_date', 'fieldB_time',
                         'fieldC_item', 'fieldD_location', 'fieldE_photo', 'photoPreviewContainer',
                         'fieldF_contractor', 'fieldG_inspector', 'actionButtonsContainer', 'downloadButtonsContainer',
                         'btnSubmit', 'btnSubmitText', 'btnSubmitLoader', 'editBadgeContainer',
                         'btnMonthView', 'btnWeekView', 'syncStatus', 'syncStatusMsg', 'btnNow', 'deleteBtnContainer',
                         'recordId', 'isFromCloud', 'oldFolderName', 'syncTimeText', 'btnManualSync', 'syncIcon',
                         'contractorReqStar', 'inspectorReqStar', 'watermarkCheckbox', 'watermarkDate', 'btnWatermarkToday',
                         'photoViewerModal', 'viewerImage', 'viewerCounter',
                         'customModal', 'customModalMessage', 'customModalIcon', 'customModalOkBtn', 'customModalCancelBtn'];
            ids.forEach(id => el[id] = document.getElementById(id));
            if (el.recordForm) el.form = el.recordForm;
        }

        // Custom Notification without native alert/confirm
        window.showMsg = function(msg, iconClass = 'fa-info-circle text-blue-600') {
            el.customModalIcon.innerHTML = `<i class="fas ${iconClass}"></i>`;
            el.customModalMessage.innerText = msg;
            el.customModalCancelBtn.classList.add('hidden');
            el.customModalOkBtn.innerText = "確定";
            el.customModalOkBtn.onclick = closeCustomModal;
            el.customModal.classList.remove('hidden');
        };

        window.showConfirm = function(msg, onYes) {
            el.customModalIcon.innerHTML = `<i class="fas fa-exclamation-triangle text-amber-500"></i>`;
            el.customModalMessage.innerText = msg;
            el.customModalCancelBtn.classList.remove('hidden');
            el.customModalOkBtn.innerText = "確定";
            el.customModalOkBtn.onclick = () => {
                closeCustomModal();
                if(onYes) onYes();
            };
            el.customModal.classList.remove('hidden');
        };

        window.closeCustomModal = function() {
            el.customModal.classList.add('hidden');
        };

        function loadRecordsFromLocal() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try { records = JSON.parse(data); } catch(e) { records = []; }
            }
        }

        function saveRecordsToLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }
        
        window.fetchDataFromCloud = async function(isManual = false) {
            if (isManual) {
                el.btnManualSync.disabled = true;
                el.syncIcon.classList.add('fa-spin');
                el.syncTimeText.innerText = "更新中...";
            }
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                const result = await response.json();
                
                if (result.status === 'success' && result.records) {
                    const cloudRecords = result.records;
                    const localUnsynced = records.filter(r => !r.isFromCloud);
                    
                    const newRecords = [...localUnsynced];
                    cloudRecords.forEach(cr => {
                        newRecords.push({...cr, isFromCloud: true});
                    });
                    
                    records = newRecords;
                    saveRecordsToLocal();
                    renderCalendar();
                    
                    const now = new Date();
                    el.syncTimeText.innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    
                    if(!isManual) {
                        el.syncStatus.classList.remove('hidden');
                        el.syncStatusMsg.innerText = "已同步雲端";
                        setTimeout(() => el.syncStatus.classList.add('hidden'), 3000);
                    } else {
                        showMsg("雲端同步完成！已自動更新行事曆內容。", "fa-check-circle text-green-600");
                    }
                }
            } catch (error) {
                console.warn("雲端同步中斷:", error);
                if(isManual) {
                    el.syncTimeText.innerText = "連線失敗";
                    showMsg("目前無法連線至雲端，請確認網路與GAS權限。", "fa-times-circle text-red-600");
                }
            } finally {
                if(isManual) {
                    el.btnManualSync.disabled = false;
                    el.syncIcon.classList.remove('fa-spin');
                }
            }
        };

        window.toggleSidebar = function() {
            const isOpen = !el.sidebar.classList.contains('-translate-x-full');
            if (isOpen) {
                el.sidebar.classList.add('-translate-x-full');
                el.sidebarOverlay.classList.add('hidden');
            } else {
                el.sidebar.classList.remove('-translate-x-full');
                el.sidebarOverlay.classList.remove('hidden');
            }
        };

        window.setMode = function(mode) {
            state.appMode = mode;
            toggleSidebar();
            
            el.mainHeader.classList.remove('bg-blue-600', 'bg-orange-600', 'bg-green-600');
            el.modalHeader.classList.remove('bg-blue-600', 'bg-orange-600', 'bg-green-600');
            el.btnSubmit.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'bg-orange-600', 'hover:bg-orange-700');
            
            if (mode === 'add') {

        window.handlePhotoUpload = async function(event) {
            const files = event.target.files;
            if (files.length + currentPhotos.length > 10) {
                showMsg('最多只能放置十張照片', 'fa-exclamation-circle text-amber-500');
                el.fieldE_photo.value = '';
                return;
            }

            const useWatermark = el.watermarkCheckbox.checked;
            const watermarkDateStr = el.watermarkDate.value ? formatDateSlash(new Date(el.watermarkDate.value)) : formatDateSlash(new Date());

            el.btnSubmit.disabled = true;
            el.btnSubmitText.innerText = "照片處理與智慧壓縮中...";
            el.btnSubmitLoader.classList.remove('hidden');

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const base64Str = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    
                    const processedBase64 = await addWatermarkAndCompress(base64Str, useWatermark, watermarkDateStr);
                    currentPhotos.push(processedBase64);
                }
                renderPhotoPreview();
                checkPhotoUnlock();
            } catch (e) {
                console.error("照片處理失敗", e);
                showMsg("照片處理失敗，請重試", 'fa-times-circle text-red-600');
            } finally {
                el.fieldE_photo.value = '';
                el.btnSubmit.disabled = false;
                el.btnSubmitText.innerText = state.appMode === 'add' ? "完成上傳" : "儲存修改";
                el.btnSubmitLoader.classList.add('hidden');
            }
        };

        function addWatermarkAndCompress(base64Str, useWatermark, dateText) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width;
                    let height = img.height;
                    const MAX_DIMENSION = 1280;

                    if (width > height && width > MAX_DIMENSION) {
                        height *= MAX_DIMENSION / width;
                        width = MAX_DIMENSION;
                    } else if (height > MAX_DIMENSION) {
                        width *= MAX_DIMENSION / height;
                        height = MAX_DIMENSION;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    if (useWatermark && dateText) {
                        const fontSize = Math.max(20, Math.floor(width * 0.04));
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        ctx.fillStyle = '#fbbf24';
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'bottom';
                        
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                        ctx.shadowBlur = 6;
                        ctx.shadowOffsetX = 2;
                        ctx.shadowOffsetY = 2;
                        
                        const padding = fontSize * 0.5;
                        ctx.fillText(dateText, width - padding, height - padding);
                    }
                    
                    let quality = 0.8;
                    let dataUrl = canvas.toDataURL('image/jpeg', quality);
                    
                    while (dataUrl.length > 680000 && quality > 0.3) {
                        quality -= 0.1;
                        dataUrl = canvas.toDataURL('image/jpeg', quality);
                    }
                    
                    resolve(dataUrl);
                };
                img.src = base64Str;
            });
        }

        window.saveRecord = async function() {
            if (!el.fieldA_date.value) { showMsg('請選擇查驗日期'); return; }
            if (!el.fieldB_time.value) { showMsg('請選擇查驗時間'); return; }
            if (!el.fieldC_item.value.trim()) { showMsg('請填寫查驗項目'); return; }
            
            if (!el.fieldF_contractor.disabled) {
                if (!el.fieldF_contractor.value.trim()) { showMsg('請填寫施工廠商'); return; }
                if (!el.fieldG_inspector.value.trim()) { showMsg('請填寫現場查驗監造'); return; }
            }

            const isEdit = !!el.recordId.value;
            const newId = isEdit ? el.recordId.value : 'rec_' + Date.now();
            const recordDate = formatDateSlash(new Date(el.fieldA_date.value));

            const recordData = {
                id: newId,
                date: recordDate,
                time: el.fieldB_time.value,
                item: el.fieldC_item.value.trim(),
                location: el.fieldD_location.value.trim(),
                contractor: !el.fieldF_contractor.disabled ? el.fieldF_contractor.value.trim() : '',
                supervisor: !el.fieldG_inspector.disabled ? el.fieldG_inspector.value.trim() : '',
                photos: [...currentPhotos],
                isEdited: isEdit,
                isFromCloud: el.isFromCloud.value === 'true'
            };

            if (isEdit) {
                const idx = records.findIndex(r => r.id === newId);
                if (idx !== -1) records[idx] = recordData;
            } else {
                records.push(recordData);
            }
            saveRecordsToLocal();
            renderCalendar();

            el.btnSubmit.disabled = true;
            el.btnSubmitText.innerText = "資料上傳雲端中...";
            el.btnSubmitLoader.classList.remove('hidden');

            try {
                const payload = {
                    action: 'save',
                    oldFolderName: el.oldFolderName.value, 
                    date: recordData.date,
                    time: recordData.time,
                    item: recordData.item,
                    location: recordData.location,
                    contractor: recordData.contractor,
                    inspector: recordData.supervisor,
                    images: recordData.photos
                };

                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow', 
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    const idx = records.findIndex(r => r.id === newId);
                    if (idx !== -1) {
                        records[idx].isFromCloud = true;
                        saveRecordsToLocal();
                        renderCalendar();
                    }
                    closeModal();
                } else {
                    showMsg("雲端同步失敗：" + result.message, 'fa-times-circle text-red-600');
                }
            } catch (error) {
                console.warn('Upload via POST failed:', error);
                closeModal(); 
            } finally {
                el.btnSubmit.disabled = false;
                el.btnSubmitText.innerText = state.appMode === 'add' ? "完成上傳" : "儲存修改";
                el.btnSubmitLoader.classList.add('hidden');
            }
        };

        function renderCalendar() {
            if (state.viewMode === 'month') {

            } else {

        function renderMonthView() {
            const year = state.currentDate.getFullYear();
            const month = state.currentDate.getMonth();
            el.currentMonthLabel.innerText = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - startDate.getDay());
            
            const endDate = new Date(lastDay);
            if (endDate.getDay() !== 6) {
                endDate.setDate(endDate.getDate() + (6 - endDate.getDay()));
            }

            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            
            let html = `<div class="flex-1 overflow-x-auto"><div class="min-w-[700px] h-full flex flex-col">`;
            
            html += `<div class="grid grid-cols-7 gap-[1px] bg-gray-200 text-center text-xs sm:text-sm font-semibold text-gray-600 py-1.5 sm:py-2 sticky top-0 z-20 bg-gray-50">`;
            dayNames.forEach(d => html += `<div>${d}</div>`);
            html += `</div>`;

            html += `<div class="calendar-grid flex-1">`;
            
            let curr = new Date(startDate);
            const todayStr = new Date().toDateString();

            while (curr <= endDate) {
                const isOtherMonth = curr.getMonth() !== month;
                const isToday = curr.toDateString() === todayStr;
                html += generateCellHtml(new Date(curr), isOtherMonth, isToday);
                curr.setDate(curr.getDate() + 1);
            }
            
            html += `</div></div></div>`;
            el.calendarContainer.innerHTML = html;
        }

        function renderWeekView() {
            const startOfWeek = getStartOfWeek(state.currentDate);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);
            
            const formatShortDate = (d) => `${d.getMonth()+1}/${d.getDate()}`;
            el.currentMonthLabel.innerText = `${formatShortDate(startOfWeek)} - ${formatShortDate(endOfWeek)}`;

            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            
            let html = `<div class="flex-1 overflow-x-auto relative w-full"><div class="min-w-[1000px] flex flex-col min-h-full">`;
            
            html += `<div class="week-header-grid text-sm font-semibold text-gray-600 text-center py-2 sticky top-0 z-20 shadow-sm bg-gray-50 border-b border-gray-300">
                <div class="bg-gray-50 flex items-center justify-center text-xs">時間</div>`;
            for(let i=0; i<7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(d.getDate() + i);
                const isToday = d.toDateString() === new Date().toDateString();
                html += `<div class="bg-gray-50 flex flex-col items-center justify-center ${isToday ? 'text-blue-600 font-bold' : ''}">
                    <span>${dayNames[i]}</span>
                    <span class="text-xs">(${formatShortDate(d)})</span>
                </div>`;
            }
            html += `</div>`;

            html += `<div class="week-body-grid flex-1 relative">`;
            
            html += `<div class="flex flex-col bg-white border-r border-gray-200 w-[50px] shrink-0">`;
            for(let h=0; h<24; h++) {
                html += `<div class="time-axis-cell">${String(h).padStart(2,'0')}:00</div>`;
            }
            html += `</div>`;

            for(let i=0; i<7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(d.getDate() + i);
                const dateStr = formatDate(d);
                const dayEvents = records.filter(r => r.date === dateStr);
                
                html += `<div class="week-day-col border-r border-gray-100">`;
                
                for(let h=0; h<24; h++) {
                    html += `<div class="hour-slot"></div>`;
                }
                
                const timeGroups = {};
                dayEvents.forEach(ev => {
                    const hourPrefix = ev.time ? ev.time.split(':')[0] : '00'; 
                    if (!timeGroups[hourPrefix]) timeGroups[hourPrefix] = [];
                    timeGroups[hourPrefix].push(ev);
                });

                Object.keys(timeGroups).forEach(hourKey => {
                    const group = timeGroups[hourKey];
                    const count = group.length;
                    
                    group.forEach((ev, idx) => {
                        const timeParts = ev.time ? ev.time.split(':') : [0, 0];
                        let topOffset = 0;
                        if(timeParts.length === 2 && !isNaN(timeParts[0])) {
                            const hours = parseInt(timeParts[0]);
                            const mins = parseInt(timeParts[1]);
                            topOffset = (hours * 60) + mins;
                        }
                        
                        // Color-Coded Status: Orange = completed (has photos or contractor), Gray = incomplete
                        const hasPhotos = (ev.photos && ev.photos.length > 0) || (ev.isFromCloud && ev.contractor && ev.supervisor);
                        const badgeClass = hasPhotos 
                            ? 'bg-orange-100 text-orange-800 border-l-2 border-orange-500' 
                            : 'bg-gray-100 text-gray-500 border-l-2 border-gray-300';
                        const cloudIcon = ev.isFromCloud ? '<i class="fas fa-cloud text-[10px] ml-1 opacity-60"></i>' : '';
                        
                        const widthPct = 100 / count;
                        const leftPct = idx * widthPct;
                        
                        html += `
                            <div class="event-badge ${badgeClass} shadow-sm absolute z-10 p-1 border border-white" 
                                 style="top: ${topOffset}px; left: calc(${leftPct}%); width: calc(${widthPct}% - 2px);" 
                                 onclick="window.handleEventClick(event, '${ev.id}')" title="${ev.time} - ${ev.item}">
                                <div class="font-bold text-[10px] leading-tight flex justify-between">
                                    <span>${ev.time}</span><span>${cloudIcon}</span>
                                </div>
                                <div class="truncate text-xs font-semibold leading-tight mt-0.5">${ev.item}</div>
                                <div class="truncate text-[10px] opacity-80 leading-tight mt-0.5">${ev.contractor || ''}</div>
                            </div>
                        `;
                    });
                });
                
                html += `</div>`;
            }
            
            html += `</div></div></div>`;
            el.calendarContainer.innerHTML = html;
        }

        function generateCellHtml(cellDate, isOtherMonth, isToday = false) {
            const dateStr = formatDate(cellDate);
            const dayEvents = records.filter(r => r.date === dateStr);
            dayEvents.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            
            let classes = "calendar-cell flex flex-col";
            if(isOtherMonth) classes += " other-month";
            if(isToday) classes += " today";

            let html = `<div class="${classes}" onclick="if('${state.appMode}' === 'add') { window.openModal(); document.getElementById('fieldA_select').value='custom'; document.getElementById('fieldA_custom_container').classList.remove('hidden'); document.getElementById('fieldA_date').value='${formatDateDash(cellDate)}'; }">
                <div class="text-right text-xs sm:text-sm font-semibold mb-0.5 sm:mb-1 ${isToday ? 'text-blue-600' : ''}">${cellDate.getDate()}</div>
                <div class="flex-1 space-y-1 overflow-y-auto no-scrollbar">`;
            
            dayEvents.forEach(ev => {
                const hasPhotos = (ev.photos && ev.photos.length > 0) || (ev.isFromCloud && ev.contractor && ev.supervisor);
                const badgeClass = hasPhotos 
                    ? 'bg-orange-100 text-orange-800 border-l-2 border-orange-500' 
                    : 'bg-gray-100 text-gray-500 border-l-2 border-gray-300';
                const cloudIcon = ev.isFromCloud ? '<i class="fas fa-cloud text-[10px] ml-1 opacity-60"></i>' : '';

                html += `<div class="event-badge ${badgeClass} flex justify-between items-center" onclick="window.handleEventClick(event, '${ev.id}')" title="${ev.item}">
                    <div class="truncate"><span class="font-bold mr-1">${ev.time}</span> ${ev.item} ${ev.isEdited ? '<span class="text-red-500 font-bold">(編)</span>' : ''}</div>
                    <div>${cloudIcon}</div>
                </div>`;
            });
            
            html += `</div></div>`;
            return html;
        }

        function formatDate(d) {
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        }
        function formatDateSlash(d) {
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        }
        function formatDateDash(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function getStartOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day;
            return new Date(d.setDate(diff));
        }
    </script>
</body>
</html>
