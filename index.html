<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查驗紀錄站</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZip for downloading multiple files as an archive -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        /* Custom styles to mimic Outlook/Clean UI */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f5f7; }
        
        /* 月檢視網格 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e5e7eb; }
        .calendar-cell { background-color: white; min-height: 100px; padding: 4px; transition: background-color 0.2s; cursor: pointer; display: flex; flex-direction: column; }
        .calendar-cell:hover { background-color: #f9fafb; }
        .calendar-cell.other-month { background-color: #f9fafb; color: #9ca3af; }
        .calendar-cell.today { background-color: #eff6ff; }
        
        /* 週檢視網格 (含時間軸) */
        .week-view-container { display: flex; flex-direction: column; height: 100%; min-width: 600px; }
        .week-header-grid { display: grid; grid-template-columns: 60px repeat(7, minmax(0, 1fr)); border-bottom: 1px solid #e5e7eb; background-color: #f9fafb; position: sticky; top: 0; z-index: 10; }
        .week-body-grid { display: grid; grid-template-columns: 60px repeat(7, minmax(0, 1fr)); background-color: #e5e7eb; gap: 1px; }
        .time-axis-cell { background-color: #f9fafb; text-align: center; padding-top: 4px; font-size: 0.75rem; color: #6b7280; font-weight: 500; height: 60px; border-right: 1px solid #e5e7eb; }
        .week-day-col { background-color: white; display: flex; flex-direction: column; position: relative; }
        .hour-slot { height: 60px; border-bottom: 1px solid #f3f4f6; cursor: pointer; padding: 2px; }
        .hour-slot:hover { background-color: #f9fafb; }
        
        .event-badge { font-size: 0.7rem; padding: 4px; margin-bottom: 2px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: transform 0.1s; }
        .event-badge:hover { transform: scale(1.02); }
        .event-badge.mode-view { background-color: #dbeafe; color: #1e40af; border-left: 2px solid #3b82f6; }
        .event-badge.mode-edit { background-color: #fef3c7; color: #92400e; border-left: 2px solid #f59e0b; }
        .event-badge.cloud-synced { background-color: #e0e7ff; color: #3730a3; border-left: 2px solid #6366f1; } /* 雲端資料顏色 */

        /* Hide scrollbar for sidebar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .photo-preview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .photo-preview-item { position: relative; padding-top: 100%; background-color: #f3f4f6; border-radius: 8px; overflow: hidden; border: 1px solid #e5e7eb; }
        .photo-preview-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .remove-photo-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.5); color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>

    <script type="module">
        let records = [];
        const STORAGE_KEY = 'inspection_records_data';
        
        // 最新 API 端點
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0gm2QMcaluNA4ME4mTQJVPZaiq0DdMzx5WzM7IQoBjosgQrO5oukK2jr30juTJ4QzSw/exec';

        const state = {
            currentDate: new Date(),
            appMode: 'view', // 'view', 'add', 'edit', 'overview'
            viewMode: 'month', // 'month' or 'week'
            isSidebarOpen: false,
            isModalOpen: false,
            modalData: null,
            photosBase64: [],
            originalDataStr: ""
        };

        // DOM Elements
        const el = {
            mainHeader: document.getElementById('mainHeader'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebarOverlay'),
            menuBtn: document.getElementById('menuBtn'),
            currentMonthLabel: document.getElementById('currentMonthLabel'),
            calendarContainer: document.getElementById('calendarContainer'),
            
            // Modal Elements
            modalOverlay: document.getElementById('modalOverlay'),
            modalTitle: document.getElementById('modalTitle'),
            modalClose: document.getElementById('modalClose'),
            form: document.getElementById('inspectionForm'),
            
            // Form Fields
            fieldA_type: document.getElementById('fieldA_type'),
            fieldA_custom: document.getElementById('fieldA_custom'),
            fieldA_custom_container: document.getElementById('fieldA_custom_container'),
            fieldB_custom: document.getElementById('fieldB_custom'),
            btnNow: document.getElementById('btnNow'),
            fieldC: document.getElementById('fieldC'),
            fieldD: document.getElementById('fieldD'),
            
            // Conditional Fields
            conditionalSection: document.getElementById('conditionalSection'),
            fieldE_input: document.getElementById('fieldE_input'),
            photoPreviewContainer: document.getElementById('photoPreviewContainer'),
            fieldF: document.getElementById('fieldF'),
            fieldG: document.getElementById('fieldG'),
            
            // Buttons
            btnSave: document.getElementById('btnSave'),
            deleteBtnContainer: document.getElementById('deleteBtnContainer'),
            btnDeleteRecord: document.getElementById('btnDeleteRecord'),
            actionButtonsContainer: document.getElementById('actionButtonsContainer'),
            downloadButtonsContainer: document.getElementById('downloadButtonsContainer'),
            btnDownloadPhotos: document.getElementById('btnDownloadPhotos'),
            btnDownloadRecord: document.getElementById('btnDownloadRecord'),
            
            // Mode & View Indicators
            modeIndicator: document.getElementById('modeIndicator'),
            editBadgeContainer: document.getElementById('editBadgeContainer'),
            btnViewMonth: document.getElementById('btnViewMonth'),
            btnViewWeek: document.getElementById('btnViewWeek'),
            cloudSyncStatus: document.getElementById('cloudSyncStatus')
        };

        // Date Format Helpers
        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}/${m}/${d}`;
        }

        function formatTime(date) {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function getTomorrow() {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            return d;
        }
        
        function getStartOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day; // Adjust to Sunday
            return new Date(d.setDate(diff));
        }

        // --- 核心功能：從雲端載入資料 ---
        async function loadDataFromCloud() {
            el.cloudSyncStatus.innerHTML = '<i class="fas fa-sync fa-spin"></i> 正在同步雲端資料...';
            el.cloudSyncStatus.classList.remove('hidden');
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                
                if (data.status === 'success' && data.records) {
                    // 合併資料：保留有照片的本地資料（因為剛編輯過），將雲端純文字資料補入
                    const localRecords = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    const merged = [...localRecords];
                    
                    data.records.forEach(cloudRec => {
                        // 檢查本地是否已經有同日期、同項目的資料
                        const exists = merged.find(r => r.date === cloudRec.date && r.item === cloudRec.item);
                        if (!exists) {
                            // 賦予預設ID並加入
                            cloudRec.id = cloudRec.id || 'CLOUD_' + Date.now() + Math.random();
                            merged.push(cloudRec);
                        }
                    });
                    
                    records = merged;
                    saveData();
                    renderCalendar();
                    el.cloudSyncStatus.innerHTML = '<i class="fas fa-check-circle text-green-500"></i> 同步完成';
                    setTimeout(() => el.cloudSyncStatus.classList.add('hidden'), 3000);
                } else {
                    throw new Error(data.message || '格式異常');
                }
            } catch (error) {
                console.warn("讀取雲端資料失敗(可能是新環境尚未授權):", error);
                el.cloudSyncStatus.innerHTML = '<i class="fas fa-exclamation-triangle text-orange-500"></i> 雲端同步失敗，顯示本機資料';
                setTimeout(() => el.cloudSyncStatus.classList.add('hidden'), 4000);
            }
        }

        // Local Storage
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) records = JSON.parse(stored);
            renderCalendar();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }

        // --- UI Rendering ---
        
        function switchView(view) {
            state.viewMode = view;
            
            if(view === 'month') {
                el.btnViewMonth.classList.replace('text-white', 'text-gray-800');
                el.btnViewMonth.classList.replace('hover:bg-white/10', 'bg-white');
                el.btnViewWeek.classList.replace('text-gray-800', 'text-white');
                el.btnViewWeek.classList.replace('bg-white', 'hover:bg-white/10');
            } else {
                el.btnViewWeek.classList.replace('text-white', 'text-gray-800');
                el.btnViewWeek.classList.replace('hover:bg-white/10', 'bg-white');
                el.btnViewMonth.classList.replace('text-gray-800', 'text-white');
                el.btnViewMonth.classList.replace('bg-white', 'hover:bg-white/10');
            }
            renderCalendar();
        }

        function renderCalendar() {
            el.calendarContainer.innerHTML = '';
            if (state.viewMode === 'month') {
                renderMonthView();
            } else {
                renderWeekView();
            }
        }

        function renderMonthView() {
            const year = state.currentDate.getFullYear();
            const month = state.currentDate.getMonth();
            el.currentMonthLabel.innerText = `${year}年 ${month + 1}月`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startingDayOfWeek = firstDay.getDay(); 
            const totalDays = lastDay.getDate();
            
            // Header for Days
            let html = `
            <div class="grid grid-cols-7 border-b bg-gray-50 text-center py-2 text-sm font-semibold text-gray-600 sticky top-0 z-10">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>
            <div class="flex-1 calendar-grid overflow-y-auto">`;
            
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = 0; i < startingDayOfWeek; i++) {
                const d = new Date(year, month - 1, prevMonthLastDay - startingDayOfWeek + i + 1);
                html += generateCellHtml(d, true);
            }
            
            const today = new Date();
            for (let i = 1; i <= totalDays; i++) {
                const d = new Date(year, month, i);
                const isToday = d.toDateString() === today.toDateString();
                html += generateCellHtml(d, false, isToday);
            }
            
            const remainingCells = 42 - (startingDayOfWeek + totalDays);
            for (let i = 1; i <= remainingCells; i++) {
                const d = new Date(year, month + 1, i);
                html += generateCellHtml(d, true);
            }
            
            html += `</div>`;
            el.calendarContainer.innerHTML = html;
        }

        function renderWeekView() {
            const startOfWeek = getStartOfWeek(state.currentDate);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);
            
            // Set label to show week range
            const formatShortDate = (d) => `${d.getMonth()+1}/${d.getDate()}`;
            el.currentMonthLabel.innerText = `${formatShortDate(startOfWeek)} - ${formatShortDate(endOfWeek)}`;

            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            let headerHtml = `<div class="week-header-grid text-sm font-semibold text-gray-600 text-center py-2">
                <div>時間</div>`;
            
            const days = [];
            for(let i=0; i<7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(d.getDate() + i);
                days.push(d);
                const isToday = d.toDateString() === new Date().toDateString();
                headerHtml += `<div class="${isToday ? 'text-blue-600 font-bold' : ''}">${dayNames[i]} (${formatShortDate(d)})</div>`;
            }
            headerHtml += `</div>`;

            let bodyHtml = `<div class="flex-1 overflow-x-auto overflow-y-auto relative no-scrollbar"><div class="week-body-grid min-w-[600px]">`;
            
            // Create time axis
            bodyHtml += `<div class="flex flex-col bg-white">`;
            for(let h=0; h<24; h++) {
                bodyHtml += `<div class="time-axis-cell">${String(h).padStart(2,'0')}:00</div>`;
            }
            bodyHtml += `</div>`;

            // Create 7 columns for days
            for(let i=0; i<7; i++) {
                const dateStr = formatDate(days[i]);
                const dayEvents = records.filter(r => r.date === dateStr);
                
                bodyHtml += `<div class="week-day-col">`;
                
                // Render 24 empty slots for visual grid
                for(let h=0; h<24; h++) {
                    bodyHtml += `<div class="hour-slot"></div>`;
                }
                
                // Absolute position events over the grid
                dayEvents.forEach(ev => {
                    const timeParts = ev.time.split(':');
                    let topOffset = 0;
                    if(timeParts.length === 2 && !isNaN(timeParts[0])) {
                        const hours = parseInt(timeParts[0]);
                        const mins = parseInt(timeParts[1]);
                        topOffset = (hours * 60) + mins; // 1px per minute since slot is 60px height
                    }
                    
                    const isComplete = ev.contractor && ev.supervisor && (ev.photos?.length > 0 || ev.isFromCloud);
                    const badgeClass = ev.isFromCloud ? 'cloud-synced' : (isComplete ? 'mode-view' : 'bg-gray-100 text-gray-700 border-l-2 border-gray-400');
                    
                    bodyHtml += `
                        <div class="event-badge ${badgeClass} shadow-md absolute left-1 right-1 z-10" 
                             style="top: ${topOffset}px;" 
                             onclick="handleEventClick(event, '${ev.id}')" title="${ev.time} - ${ev.item}">
                            <div class="font-bold text-xs">${ev.time}</div>
                            <div class="truncate">${ev.item}</div>
                            <div class="truncate text-[10px] opacity-75">${ev.contractor || ''}</div>
                        </div>
                    `;
                });
                
                bodyHtml += `</div>`;
            }
            
            bodyHtml += `</div></div>`;
            el.calendarContainer.innerHTML = `<div class="week-view-container">${headerHtml}${bodyHtml}</div>`;
        }

        function generateCellHtml(cellDate, isOtherMonth, isToday = false) {
            const dateStr = formatDate(cellDate);
            let html = `<div class="calendar-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}">
                <div class="text-right p-1 ${isToday ? 'font-bold text-blue-600' : 'text-gray-700'}">${cellDate.getDate()}</div>
                <div class="flex-1 overflow-y-auto px-1 pb-1 no-scrollbar">`;
            
            const dayEvents = records.filter(r => r.date === dateStr);
            dayEvents.forEach(ev => {
                const isComplete = ev.contractor && ev.supervisor && (ev.photos?.length > 0 || ev.isFromCloud);
                const badgeClass = ev.isFromCloud ? 'cloud-synced' : (isComplete ? 'mode-view' : 'bg-gray-100 text-gray-700 border-l-2 border-gray-400');
                const editedMark = ev.isEdited ? '<span class="text-[10px] text-orange-500 ml-1">(編)</span>' : '';
                
                html += `
                    <div class="event-badge ${badgeClass} shadow-sm truncate" onclick="handleEventClick(event, '${ev.id}')" title="${ev.time} - ${ev.item}">
                        ${ev.time} ${ev.item} ${editedMark}
                    </div>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }

        function toggleSidebar() {
            state.isSidebarOpen = !state.isSidebarOpen;
            if (state.isSidebarOpen) {
                el.sidebar.classList.remove('-translate-x-full');
                el.sidebarOverlay.classList.remove('hidden');
            } else {
                el.sidebar.classList.add('-translate-x-full');
                el.sidebarOverlay.classList.add('hidden');
            }
        }

        // 動態更換 Header 顏色
        function updateHeaderColor() {
            el.mainHeader.classList.remove('bg-blue-600', 'bg-orange-600', 'bg-green-600');
            if (state.appMode === 'add') el.mainHeader.classList.add('bg-blue-600');
            else if (state.appMode === 'edit') el.mainHeader.classList.add('bg-orange-600');
            else if (state.appMode === 'overview') el.mainHeader.classList.add('bg-green-600');
            else el.mainHeader.classList.add('bg-blue-600'); // default
        }

        function setAppMode(mode, title) {
            state.appMode = mode;
            updateHeaderColor();
            
            el.modeIndicator.innerText = `目前模式: ${title}`;
            el.modeIndicator.classList.remove('hidden');
            toggleSidebar();
            
            if (mode === 'add') {
                openModal();
            } else {
                alert(`請在行事曆上點選要${mode === 'edit' ? '編輯' : '檢視'}的紀錄。`);
            }
        }

        function changeDateOffset(delta) {
            if(state.viewMode === 'month') {
                state.currentDate.setMonth(state.currentDate.getMonth() + delta);
            } else {
                state.currentDate.setDate(state.currentDate.getDate() + (delta * 7));
            }
            renderCalendar();
        }

        window.handleEventClick = function(event, id) {
            event.stopPropagation();
            if (state.appMode === 'add') {
                alert('請先完成或關閉當前新增作業。');
                return;
            }
            
            const record = records.find(r => r.id === id);
            if (record) openModal(record);
        };

        function openModal(existingData = null) {
            state.isModalOpen = true;
            state.modalData = existingData;
            state.photosBase64 = existingData?.photos ? [...existingData.photos] : [];
            
            el.modalOverlay.classList.remove('hidden');
            el.modalOverlay.classList.add('flex');
            
            resetForm();
            
            if (state.appMode === 'overview') {
                el.modalTitle.innerText = '檢視查驗紀錄';
                setupFormForViewOnly(existingData);
            } else if (existingData && state.appMode === 'edit') {
                el.modalTitle.innerText = '編輯查驗紀錄';
                setupFormForEdit(existingData);
            } else {
                el.modalTitle.innerText = '廠商登錄查驗';
                setupFormForAdd();
            }
            
            renderPhotoPreviews();
            updateConditionalSectionVisibility();
        }

        function closeModal() {
            state.isModalOpen = false;
            state.modalData = null;
            state.photosBase64 = [];
            el.modalOverlay.classList.add('hidden');
            el.modalOverlay.classList.remove('flex');
        }

        function resetForm() {
            el.form.reset();
            el.fieldA_custom_container.classList.add('hidden');
            el.editBadgeContainer.innerHTML = '';
            
            Array.from(el.form.elements).forEach(inp => {
                if(inp.id !== 'deleteSlider' && inp.id !== 'btnNow') {
                    inp.disabled = false;
                    inp.classList.remove('bg-gray-100', 'cursor-not-allowed');
                }
            });
            el.btnNow.disabled = false;
            
            el.actionButtonsContainer.classList.remove('hidden');
            el.downloadButtonsContainer.classList.add('hidden');
            el.deleteBtnContainer.classList.add('hidden');
        }

        // 時間按鈕
        el.btnNow.addEventListener('click', () => {
            el.fieldB_custom.value = formatTime(new Date());
        });

        function setupFormForAdd() {
            // Field A setup (Removed "Next Monday")
            el.fieldA_type.innerHTML = `
                <option value="tomorrow">明天 (${formatDate(getTomorrow())})</option>
                <option value="custom">選擇日期 (不含今日)</option>
                <option value="today">今天 (${formatDate(new Date())})</option>
            `;
            
            const tomorrowStr = getTomorrow().toISOString().split('T')[0];
            el.fieldA_custom.min = tomorrowStr;
            el.btnSave.innerText = '完成上傳';
        }

        function setupFormForEdit(data) {
            el.fieldA_type.innerHTML = `<option value="custom_edit">自訂日期</option>`;
            el.fieldA_custom_container.classList.remove('hidden');
            el.fieldA_custom.value = data.date.replace(/\//g, '-');
            el.fieldA_custom.removeAttribute('min');

            el.fieldB_custom.value = data.time || '';

            el.fieldC.value = data.item || '';
            el.fieldD.value = data.location || '';
            el.fieldF.value = data.contractor || '';
            el.fieldG.value = data.supervisor || '';

            if (data.isEdited) {
                el.editBadgeContainer.innerHTML = `<span class="bg-orange-100 text-orange-800 text-xs font-medium px-2.5 py-0.5 rounded border border-orange-300">已編輯</span>`;
            }
            if (data.isFromCloud) {
                el.editBadgeContainer.innerHTML += `<span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded border border-blue-300 ml-1">雲端資料</span>`;
            }

            el.btnSave.innerText = '儲存修改';
            el.deleteBtnContainer.classList.remove('hidden');
            
            state.originalDataStr = JSON.stringify({
                date: el.fieldA_custom.value, time: el.fieldB_custom.value, item: el.fieldC.value, location: el.fieldD.value, contractor: el.fieldF.value, supervisor: el.fieldG.value, photosCount: state.photosBase64.length
            });
        }

        function setupFormForViewOnly(data) {
            setupFormForEdit(data);
            
            Array.from(el.form.elements).forEach(inp => {
                if (inp.id !== 'modalClose') {
                    inp.disabled = true;
                    inp.classList.add('bg-gray-100', 'cursor-not-allowed', 'text-gray-600');
                }
            });
            el.btnNow.disabled = true;
            
            el.actionButtonsContainer.classList.add('hidden');
            el.downloadButtonsContainer.classList.remove('hidden');
        }

        el.fieldA_type.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                el.fieldA_custom_container.classList.remove('hidden');
                el.fieldA_custom.required = true;
            } else {
                el.fieldA_custom_container.classList.add('hidden');
                el.fieldA_custom.required = false;
            }
            updateConditionalSectionVisibility();
        });

        function updateConditionalSectionVisibility() {
            if (state.appMode === 'add') {
                const isToday = el.fieldA_type.value === 'today';
                if (isToday) {
                    el.conditionalSection.classList.remove('opacity-50', 'pointer-events-none');
                    el.fieldE_input.required = true;
                    el.fieldF.required = true;
                    el.fieldG.required = true;
                } else {
                    el.conditionalSection.classList.add('opacity-50', 'pointer-events-none');
                    el.fieldE_input.required = false;
                    el.fieldF.required = false;
                    el.fieldG.required = false;
                    state.photosBase64 = [];
                    el.fieldF.value = '';
                    el.fieldG.value = '';
                    renderPhotoPreviews();
                }
            } else {
                el.conditionalSection.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        // Photo Processing with Watermark
        async function processPhotoWithWatermark(file, dateString) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        ctx.font = `bold ${Math.floor(height * 0.05)}px sans-serif`;
                        ctx.fillStyle = 'rgba(255, 165, 0, 0.9)';
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'bottom';
                        
                        const textX = width - Math.floor(width * 0.02);
                        const textY = height - Math.floor(height * 0.02);
                        
                        ctx.strokeText(dateString, textX, textY);
                        ctx.fillText(dateString, textX, textY);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        el.fieldE_input.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (state.photosBase64.length + files.length > 4) { alert('最多只能上傳 4 張照片！'); return; }

            let watermarkDateStr = getResolvedDateString();

            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                try {
                    const base64 = await processPhotoWithWatermark(file, watermarkDateStr);
                    state.photosBase64.push(base64);
                } catch (error) { console.error("處理照片錯誤:", error); }
            }
            e.target.value = ''; 
            renderPhotoPreviews();
        });

        function renderPhotoPreviews() {
            el.photoPreviewContainer.innerHTML = '';
            
            // 處理純雲端載入未附圖的顯示提示
            if(state.modalData && state.modalData.isFromCloud && (!state.photosBase64 || state.photosBase64.length === 0)) {
                 el.photoPreviewContainer.innerHTML = `<div class="col-span-2 text-sm text-gray-500 bg-gray-50 p-2 rounded text-center">此為雲端讀取資料，照片請至總覽或雲端資料夾檢視。</div>`;
            }

            state.photosBase64.forEach((base64, index) => {
                const isViewOnly = state.appMode === 'overview';
                el.photoPreviewContainer.innerHTML += `
                    <div class="photo-preview-item shadow-sm">
                        <img src="${base64}" class="photo-preview-img cursor-pointer" onclick="openFullPhoto('${base64}')">
                        ${!isViewOnly ? `<div class="remove-photo-btn" onclick="removePhoto(${index})"><i class="fas fa-times"></i></div>` : ''}
                    </div>
                `;
            });
            
            if (state.photosBase64.length >= 4) el.fieldE_input.parentElement.classList.add('hidden');
            else if (state.appMode !== 'overview') el.fieldE_input.parentElement.classList.remove('hidden');
        }

        window.removePhoto = (index) => { state.photosBase64.splice(index, 1); renderPhotoPreviews(); };
        window.openFullPhoto = (base64) => {
            const w = window.open("");
            w.document.write(`<img src="${base64}" style="max-width: 100%; max-height: 100vh; display: block; margin: 0 auto;">`);
        };

        function getResolvedDateString() {
            const type = el.fieldA_type.value;
            if (type === 'tomorrow') return formatDate(getTomorrow());
            if (type === 'today') return formatDate(new Date());
            if (type === 'custom' || type === 'custom_edit') {
                return el.fieldA_custom.value ? el.fieldA_custom.value.replace(/-/g, '/') : formatDate(new Date());
            }
            return formatDate(new Date());
        }

        // Form Submit
        el.form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const dateStr = getResolvedDateString();
            const timeStr = el.fieldB_custom.value;
            const item = el.fieldC.value.trim();
            const location = el.fieldD.value.trim();
            const contractor = el.fieldF.value.trim();
            const supervisor = el.fieldG.value.trim();

            if ( (state.appMode === 'add' && el.fieldA_type.value === 'today') || 
                 (state.appMode === 'edit' && (contractor || supervisor || state.photosBase64.length > 0)) ) {
                // 如果是雲端載下來的資料，編輯時若不改圖可通融，若是新上傳務必有圖
                if (state.photosBase64.length === 0 && !(state.modalData && state.modalData.isFromCloud)) {
                    alert("請上傳至少一張查驗照片"); return;
                }
                if (!contractor) { alert("請填寫施工廠商"); return; }
                if (!supervisor) { alert("請填寫現場查驗監造"); return; }
            }

            const payload = {
                date: dateStr, time: timeStr, item, location, photos: state.photosBase64, contractor, supervisor, timestamp: Date.now()
            };

            try {
                el.btnSave.innerText = '處理中...';
                el.btnSave.disabled = true;

                let oldFolderName = null;

                if (state.appMode === 'add') {
                    payload.isEdited = false;
                    payload.id = 'ID_' + Date.now();
                    records.push(payload);
                    saveData();
                    renderCalendar();
                } else if (state.appMode === 'edit' && state.modalData) {
                    const currentDataStr = JSON.stringify({
                        date: el.fieldA_custom.value, time: el.fieldB_custom.value, item, location, contractor, supervisor, photosCount: state.photosBase64.length
                    });
                    
                    payload.isEdited = state.modalData.isEdited || (currentDataStr !== state.originalDataStr);
                    payload.id = state.modalData.id;
                    
                    // 產生舊的資料夾名稱 (供雲端重新命名或刪除對比使用)
                    if (state.modalData.date && state.modalData.item) {
                        oldFolderName = state.modalData.date.replace(/\//g, '') + '_' + state.modalData.item;
                    }
                    
                    const index = records.findIndex(r => r.id === payload.id);
                    if (index !== -1) { records[index] = payload; saveData(); renderCalendar(); }
                }

                // 雲端同步上傳
                try {
                    el.btnSave.innerText = '雲端備份中...';
                    const gasPayload = {
                        action: 'save',
                        oldFolderName: oldFolderName,
                        date: payload.date, time: payload.time, item: payload.item, location: payload.location, contractor: payload.contractor, inspector: payload.supervisor, images: payload.photos
                    };

                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(gasPayload)
                    });
                    
                    const rawText = await response.text();
                    try {
                        const result = JSON.parse(rawText);
                        if (result.status === 'success') console.log(`雲端上傳成功：${result.folderName}`);
                        else alert(`雲端同步異常: ${result.message}\n(但本機已儲存)`);
                    } catch (parseError) {
                        throw new Error('伺服器回傳格式錯誤，請檢查權限設定。');
                    }
                } catch (uploadErr) {
                    alert(`雲端同步失敗：\n${uploadErr.message}\n(※ 資料已安全儲存於本機)`);
                }

                closeModal();
            } catch (error) {
                alert("儲存失敗，請重試。");
            } finally {
                el.btnSave.innerText = '完成上傳';
                el.btnSave.disabled = false;
            }
        });

        // 刪除按鈕邏輯
        el.btnDeleteRecord.addEventListener('click', async () => {
            if (!state.modalData || !state.modalData.id) return;
            
            if (confirm('確定要刪除此筆紀錄嗎？\n(檔案將移至雲端「已刪除」資料夾)')) {
                const originalDateStr = state.modalData.date.replace(/\//g, '');
                const originalItem = state.modalData.item;
                const oldFolderName = `${originalDateStr}_${originalItem}`;
                
                const originalBtnText = el.btnDeleteRecord.innerHTML;
                el.btnDeleteRecord.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刪除中...';
                el.btnDeleteRecord.disabled = true;

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'delete', oldFolderName: oldFolderName })
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        records = records.filter(r => r.id !== state.modalData.id);
                        saveData(); 
                        renderCalendar(); 
                        closeModal();
                    } else {
                        alert("雲端刪除失敗: " + result.message);
                    }
                } catch (error) {
                    console.error(error);
                    alert("連線失敗，請檢查網路狀態。");
                } finally {
                    el.btnDeleteRecord.innerHTML = originalBtnText;
                    el.btnDeleteRecord.disabled = false;
                }
            }
        });

        // Downloads
        function generateFolderName(dateStr, itemStr) {
            return `${dateStr.replace(/\//g, '')}_${itemStr.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_')}`;
        }

        el.btnDownloadRecord.addEventListener('click', () => {
            if(!state.modalData) return;
            const data = state.modalData;
            const content = `查驗日期: ${data.date}\n查驗時間: ${data.time}\n查驗項目: ${data.item}\n查驗地點: ${data.location || '無'}\n施工廠商: ${data.contractor || '尚未填寫'}\n現場查驗監造: ${data.supervisor || '尚未填寫'}`;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${generateFolderName(data.date, data.item)}_紀錄.txt`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        });

        el.btnDownloadPhotos.addEventListener('click', async () => {
             if(!state.modalData || !state.modalData.photos || state.modalData.photos.length === 0) {
                 alert("本機沒有可下載的照片，請至雲端資料夾檢視。"); return;
             }
             el.btnDownloadPhotos.innerText = '打包下載中...';
             el.btnDownloadPhotos.disabled = true;
             try {
                 const zip = new JSZip();
                 const folderName = generateFolderName(state.modalData.date, state.modalData.item);
                 const imgFolder = zip.folder(folderName);
                 state.modalData.photos.forEach((base64Str, index) => {
                     const base64Data = base64Str.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");
                     imgFolder.file(`photo_${index + 1}.jpg`, base64Data, {base64: true});
                 });
                 const content = await zip.generateAsync({type:"blob"});
                 const url = URL.createObjectURL(content);
                 const a = document.createElement('a'); a.href = url; a.download = `${folderName}_照片.zip`;
                 document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
             } finally {
                 el.btnDownloadPhotos.innerHTML = '<i class="fas fa-images"></i> 下載照片';
                 el.btnDownloadPhotos.disabled = false;
             }
        });

        window.onload = async () => {
            loadData(); // 先載入本機暫存，讓畫面不會空
            await loadDataFromCloud(); // 背後拉取雲端資料覆蓋/補充
        };

        // UI Listeners
        el.menuBtn.addEventListener('click', toggleSidebar);
        el.sidebarOverlay.addEventListener('click', toggleSidebar);
        el.modalClose.addEventListener('click', closeModal);
        el.modalOverlay.addEventListener('click', (e) => { if (e.target === el.modalOverlay) closeModal(); });
        
        document.getElementById('prevBtn').addEventListener('click', () => changeDateOffset(-1));
        document.getElementById('nextBtn').addEventListener('click', () => changeDateOffset(1));
        
        el.btnViewMonth.addEventListener('click', () => switchView('month'));
        el.btnViewWeek.addEventListener('click', () => switchView('week'));
        
        document.getElementById('menuBtnAdd').addEventListener('click', () => setAppMode('add', '廠商登錄查驗'));
        document.getElementById('menuBtnEdit').addEventListener('click', () => setAppMode('edit', '監造資料登錄 / 修改'));
        document.getElementById('menuBtnOverview').addEventListener('click', () => setAppMode('overview', '紀錄總覽 (檢視/下載)'));

    </script>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <header id="mainHeader" class="bg-blue-600 transition-colors duration-300 text-white flex items-center justify-between px-4 py-3 shadow-md z-20 relative">
        <div class="flex items-center gap-4">
            <button id="menuBtn" class="text-white hover:bg-black/10 p-2 rounded-full transition focus:outline-none">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <div class="flex flex-col">
                <h1 class="font-bold text-xl leading-tight">查驗紀錄站</h1>
                <span id="modeIndicator" class="text-xs text-white/80 hidden bg-black/20 px-2 py-0.5 rounded-full inline-block mt-0.5">目前模式: 檢視</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <!-- 視圖切換 (月/週) -->
            <div class="flex bg-black/20 rounded-lg p-1 mr-1 text-sm shadow-inner">
                <button id="btnViewMonth" class="px-3 py-1 rounded bg-white text-gray-800 font-bold shadow-sm transition">月</button>
                <button id="btnViewWeek" class="px-3 py-1 rounded text-white hover:bg-white/20 transition">週</button>
            </div>
            
            <div class="flex items-center gap-2 bg-black/20 px-3 py-1.5 rounded-lg">
                <button id="prevBtn" class="hover:text-gray-200 p-1"><i class="fas fa-chevron-left"></i></button>
                <span id="currentMonthLabel" class="font-bold min-w-[90px] text-center text-sm">YYYY年 M月</span>
                <button id="nextBtn" class="hover:text-gray-200 p-1"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </header>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden transition-opacity"></div>
    <div id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-white shadow-2xl z-40 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="bg-gray-50 p-6 border-b flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-800 text-white rounded-full flex items-center justify-center font-bold text-lg shadow-sm">查</div>
            <div>
                <h2 class="font-bold text-gray-800 text-lg">查驗紀錄站</h2>
                <p class="text-xs text-gray-500">工程管理系統</p>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button id="menuBtnAdd" class="w-full text-left px-4 py-3 rounded-lg hover:bg-blue-50 text-gray-700 hover:text-blue-700 transition flex items-center gap-3 border border-transparent hover:border-blue-100">
                <div class="bg-blue-100 text-blue-600 p-2 rounded-md"><i class="fas fa-plus-circle w-4 text-center"></i></div>
                <div><div class="font-semibold">廠商登錄查驗</div><div class="text-xs text-gray-400 mt-0.5">建議於查驗一天前登錄</div></div>
            </button>
            <button id="menuBtnEdit" class="w-full text-left px-4 py-3 rounded-lg hover:bg-orange-50 text-gray-700 hover:text-orange-700 transition flex items-center gap-3 border border-transparent hover:border-orange-100">
                <div class="bg-orange-100 text-orange-600 p-2 rounded-md"><i class="fas fa-edit w-4 text-center"></i></div>
                <div><div class="font-semibold">監造查驗資料登錄</div><div class="text-xs text-gray-400 mt-0.5">或 廠商修改資料</div></div>
            </button>
            <button id="menuBtnOverview" class="w-full text-left px-4 py-3 rounded-lg hover:bg-green-50 text-gray-700 hover:text-green-700 transition flex items-center gap-3 border border-transparent hover:border-green-100">
                <div class="bg-green-100 text-green-600 p-2 rounded-md"><i class="fas fa-list-alt w-4 text-center"></i></div>
                <div><div class="font-semibold">查驗紀錄總覽</div><div class="text-xs text-gray-400 mt-0.5">檢視與下載資料</div></div>
            </button>
        </nav>
        <div class="p-4 border-t text-xs text-gray-400 text-center relative">
            <span id="cloudSyncStatus" class="hidden absolute -top-8 left-0 right-0 text-center bg-black/70 text-white rounded-full mx-4 py-1.5 backdrop-blur shadow"><i class="fas fa-sync fa-spin"></i> 同步中...</span>
            資料自動儲存與同步於雲端
        </div>
    </div>

    <!-- 動態產生月檢視或週檢視的容器 -->
    <main id="calendarContainer" class="flex-1 flex flex-col bg-white overflow-hidden relative"></main>

    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden relative border border-gray-100">
            
            <div class="px-5 py-4 border-b flex justify-between items-center bg-gray-50/50">
                <div class="flex items-center gap-2">
                    <h3 id="modalTitle" class="text-lg font-bold text-gray-800">登錄查驗</h3>
                    <div id="editBadgeContainer"></div>
                </div>
                <button id="modalClose" class="text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 p-1.5 rounded-full transition w-8 h-8 flex items-center justify-center focus:outline-none"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1 no-scrollbar space-y-5">
                <form id="inspectionForm" class="space-y-4">
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">A. 查驗日期 <span class="text-red-500">*</span></label>
                        <select id="fieldA_type" class="w-full border-gray-300 rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 bg-white" required></select>
                        <div id="fieldA_custom_container" class="mt-2 hidden">
                            <input type="date" id="fieldA_custom" class="w-full border-gray-300 rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">B. 查驗時間 <span class="text-red-500">*</span></label>
                        <div class="flex gap-2">
                            <input type="time" id="fieldB_custom" class="flex-1 border-gray-300 rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500" required>
                            <button type="button" id="btnNow" class="whitespace-nowrap px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg text-sm font-semibold transition focus:outline-none"><i class="far fa-clock mr-1"></i>現在時間</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">C. 查驗項目 <span class="text-red-500">*</span></label>
                        <input type="text" id="fieldC" placeholder="例如: 鋼筋綁紮、混凝土澆置..." class="w-full border-gray-300 rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500" required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">D. 查驗地點 <span class="text-gray-400 font-normal text-xs">(選填)</span></label>
                        <input type="text" id="fieldD" placeholder="例如: A棟 2F 柱..." class="w-full border-gray-300 rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <hr class="border-gray-200">

                    <div id="conditionalSection" class="space-y-4 opacity-50 pointer-events-none transition-opacity duration-300 bg-gray-50/50 -mx-5 px-5 py-3 border-y border-gray-100">
                        <div class="text-xs text-gray-500 font-medium mb-2 flex items-center gap-1"><i class="fas fa-info-circle"></i> 當日查驗或編輯模式需填寫以下資料</div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">E. 查驗照片 <span class="text-red-500">*</span> <span class="text-xs font-normal text-gray-500">(最多 4 張，自動壓日期)</span></label>
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:bg-gray-50 transition cursor-pointer relative bg-white">
                                <i class="fas fa-camera text-2xl text-gray-400 mb-2"></i>
                                <div class="text-sm text-gray-600 font-medium">點擊拍照或上傳照片</div>
                                <input type="file" id="fieldE_input" accept="image/*" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            </div>
                            <div id="photoPreviewContainer" class="photo-preview-grid mt-3"></div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">F. 施工廠商 (姓名) <span class="text-red-500">*</span></label>
                            <input type="text" id="fieldF" placeholder="請輸入廠商代表姓名" class="w-full border-gray-300 rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 bg-white">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">G. 現場查驗監造 (姓名) <span class="text-red-500">*</span></label>
                            <input type="text" id="fieldG" placeholder="請輸入監造人員姓名" class="w-full border-gray-300 rounded-lg shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 bg-white">
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="px-5 py-4 border-t bg-gray-50/80 backdrop-blur-sm">
                <div id="actionButtonsContainer" class="space-y-3">
                    <button type="submit" form="inspectionForm" id="btnSave" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded-lg shadow-sm transition focus:ring-4 focus:ring-gray-300">完成上傳</button>
                    <div id="deleteBtnContainer" class="hidden pt-2 border-t border-gray-200">
                        <button type="button" id="btnDeleteRecord" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2.5 px-4 rounded-lg shadow-sm border border-red-200 transition focus:ring-4 focus:ring-red-100 flex items-center justify-center gap-2">
                            <i class="fas fa-trash-alt"></i> 刪除紀錄
                        </button>
                    </div>
                </div>

                <div id="downloadButtonsContainer" class="hidden grid grid-cols-2 gap-3">
                    <button id="btnDownloadRecord" class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 font-semibold py-2.5 px-4 rounded-lg shadow-sm transition flex items-center justify-center gap-2"><i class="fas fa-file-alt text-gray-500"></i> 下載紀錄</button>
                    <button id="btnDownloadPhotos" class="w-full bg-gray-100 border border-gray-200 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 px-4 rounded-lg shadow-sm transition flex items-center justify-center gap-2"><i class="fas fa-images"></i> 下載照片</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
