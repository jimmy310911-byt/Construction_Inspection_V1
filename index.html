<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查驗紀錄站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f5f7; }
        
        /* 月檢視樣式 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e5e7eb; min-width: 700px; }
        .calendar-cell { background-color: white; min-height: 100px; padding: 4px; transition: background-color 0.2s; cursor: pointer; }
        .calendar-cell:hover { background-color: #f9fafb; }
        .calendar-cell.other-month { background-color: #f9fafb; color: #9ca3af; }
        .calendar-cell.today { background-color: #eff6ff; }
        
        /* 週檢視樣式 */
        .week-header-grid { display: grid; grid-template-columns: 60px repeat(7, 1fr); gap: 1px; }
        .week-body-grid { display: grid; grid-template-columns: 60px repeat(7, 1fr); gap: 1px; background-color: #e5e7eb; }
        .time-axis-cell { background-color: white; height: 60px; text-align: center; font-size: 0.75rem; color: #6b7280; padding-top: 4px; border-bottom: 1px solid #f3f4f6; }
        .week-day-col { background-color: white; position: relative; }
        .hour-slot { height: 60px; border-bottom: 1px dashed #e5e7eb; box-sizing: border-box; }
        
        /* 紀錄標籤 */
        .event-badge { font-size: 0.7rem; padding: 2px 4px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: transform 0.1s; }
        .event-badge:hover { transform: scale(1.02); z-index: 50 !important; }
        .mode-view { background-color: #dbeafe; color: #1e40af; border-left: 2px solid #3b82f6; }
        .cloud-synced { background-color: #dcfce3; color: #166534; border-left: 2px solid #22c55e; }
        
        /* 隱藏卷軸 (選用) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-5 bg-blue-600 text-white flex justify-between items-center">
            <h2 class="text-xl font-bold">查驗紀錄站</h2>
            <button onclick="toggleSidebar()" class="text-white hover:text-gray-200 focus:outline-none">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3">
            <button onclick="setMode('add')" class="w-full text-left p-3 rounded-lg flex items-center space-x-3 transition-colors bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200">
                <i class="fas fa-plus-circle w-5"></i>
                <span class="font-medium">1 廠商登錄查驗</span>
            </button>
            <button onclick="setMode('edit')" class="w-full text-left p-3 rounded-lg flex items-center space-x-3 transition-colors hover:bg-orange-50 text-gray-700 hover:text-orange-700 border border-transparent hover:border-orange-200">
                <i class="fas fa-edit w-5"></i>
                <span class="font-medium">2 監造查驗資料登錄/修改</span>
            </button>
            <button onclick="setMode('view')" class="w-full text-left p-3 rounded-lg flex items-center space-x-3 transition-colors hover:bg-green-50 text-gray-700 hover:text-green-700 border border-transparent hover:border-green-200">
                <i class="fas fa-list-alt w-5"></i>
                <span class="font-medium">3 查驗紀錄總覽</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full relative">
        <!-- Header -->
        <header id="mainHeader" class="bg-blue-600 text-white shadow-md flex flex-wrap items-center justify-between p-3 z-10 transition-colors duration-300">
            <div class="flex items-center space-x-3 mb-2 sm:mb-0">
                <button onclick="toggleSidebar()" class="p-2 rounded-md hover:bg-black hover:bg-opacity-20 focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <div>
                    <h1 class="text-lg font-bold leading-tight">查驗紀錄站</h1>
                    <div id="modeIndicator" class="text-xs bg-white bg-opacity-20 rounded px-2 py-0.5 mt-0.5 inline-block">目前模式: 廠商登錄查驗</div>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div class="bg-white bg-opacity-20 rounded-lg p-1 flex">
                    <button onclick="switchView('month')" id="btnMonthView" class="px-3 py-1 rounded-md text-sm font-medium bg-white text-blue-600 shadow-sm transition-colors">月</button>
                    <button onclick="switchView('week')" id="btnWeekView" class="px-3 py-1 rounded-md text-sm font-medium text-white hover:bg-white hover:bg-opacity-20 transition-colors">週</button>
                </div>
                
                <div class="flex items-center bg-white bg-opacity-20 rounded-lg px-2">
                    <button onclick="changeDateOffset(-1)" class="p-2 hover:bg-black hover:bg-opacity-20 rounded-full focus:outline-none"><i class="fas fa-chevron-left"></i></button>
                    <span id="currentMonthLabel" class="font-bold min-w-[100px] text-center text-sm sm:text-base">2026年 9月</span>
                    <button onclick="changeDateOffset(1)" class="p-2 hover:bg-black hover:bg-opacity-20 rounded-full focus:outline-none"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </header>

        <!-- Calendar Container (Scrollable horizontally on mobile) -->
        <div id="calendarContainer" class="flex-1 overflow-auto bg-white flex flex-col">
            <!-- Calendar grid will be injected here -->
        </div>
        
        <!-- Cloud Sync Status -->
        <div id="syncStatus" class="absolute bottom-2 right-2 text-xs bg-black bg-opacity-60 text-white px-2 py-1 rounded-full flex items-center space-x-1 z-10 hidden">
            <i class="fas fa-cloud-download-alt"></i>
            <span>已同步雲端</span>
        </div>
    </div>

    <!-- Modal (Floating Window) -->
    <div id="dataModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-full flex flex-col overflow-hidden relative">
            <div id="modalHeader" class="bg-blue-600 text-white p-4 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-lg" id="modalTitle">登錄查驗</h3>
                <button onclick="closeModal()" class="text-white hover:text-gray-200 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-1 text-sm">
                <form id="recordForm" class="space-y-4">
                    <input type="hidden" id="recordId">
                    <input type="hidden" id="isFromCloud" value="false">
                    <input type="hidden" id="oldFolderName" value="">
                    
                    <div id="editBadgeContainer" class="flex justify-end hidden">
                        <!-- '已編輯' badge goes here -->
                    </div>

                    <!-- A. 查驗日期 -->
                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">A. 查驗日期 (必選) <span class="text-red-500">*</span></label>
                        <select id="fieldA_select" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500 focus:ring focus:ring-blue-200" onchange="handleDateSelectChange()">
                            <option value="">請選擇</option>
                            <option value="tomorrow">明天</option>
                            <option value="today">今天</option>
                            <option value="custom">日期選擇...</option>
                        </select>
                        <div id="fieldA_custom_container" class="mt-2 hidden">
                            <input type="date" id="fieldA_date" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500">
                        </div>
                    </div>

                    <!-- B. 查驗時間 -->
                    <div id="fieldB_container">
                        <label class="block font-semibold text-gray-700 mb-1">B. 查驗時間 (必選) <span class="text-red-500">*</span></label>
                        <div class="flex space-x-2">
                            <input type="time" id="fieldB_time" class="flex-1 border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500">
                            <button type="button" id="btnNow" onclick="setNowTime()" class="px-3 py-2 bg-gray-100 border border-gray-300 rounded-md hover:bg-gray-200 whitespace-nowrap">現在時間</button>
                        </div>
                    </div>

                    <!-- C. 查驗項目 -->
                    <div id="fieldC_container">
                        <label class="block font-semibold text-gray-700 mb-1">C. 查驗項目 (必填) <span class="text-red-500">*</span></label>
                        <input type="text" id="fieldC_item" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500" placeholder="填寫查驗項目">
                    </div>

                    <!-- D. 查驗地點 -->
                    <div id="fieldD_container">
                        <label class="block font-semibold text-gray-700 mb-1">D. 查驗地點 (選填)</label>
                        <input type="text" id="fieldD_location" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500" placeholder="填寫查驗地點">
                    </div>

                    <!-- E. 查驗照片 -->
                    <div id="fieldE_container">
                        <label class="block font-semibold text-gray-700 mb-1">E. 查驗照片 (最多四張) <span class="text-red-500" id="photoReqStar">*</span></label>
                        <input type="file" id="fieldE_photo" accept="image/*" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" onchange="handlePhotoUpload(event)">
                        <div id="photoPreviewContainer" class="grid grid-cols-2 gap-2 mt-2">
                            <!-- Photos preview will be appended here -->
                        </div>
                    </div>

                    <!-- F. 施工廠商 -->
                    <div id="fieldF_container">
                        <label class="block font-semibold text-gray-700 mb-1">F. 施工廠商 (名字必填) <span class="text-red-500" id="contractorReqStar">*</span></label>
                        <input type="text" id="fieldF_contractor" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500" placeholder="填寫廠商名稱">
                    </div>

                    <!-- G. 現場查驗監造 -->
                    <div id="fieldG_container">
                        <label class="block font-semibold text-gray-700 mb-1">G. 現場查驗監造 (名字必填) <span class="text-red-500" id="inspectorReqStar">*</span></label>
                        <input type="text" id="fieldG_inspector" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:border-blue-500" placeholder="填寫監造名稱">
                    </div>
                </form>
            </div>
            
            <div class="p-4 border-t bg-gray-50 shrink-0">
                <!-- Add/Edit Mode Buttons -->
                <div id="actionButtonsContainer">
                    <button type="button" onclick="saveRecord()" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none flex justify-center items-center">
                        <span id="btnSubmitText">完成上傳</span>
                        <i id="btnSubmitLoader" class="fas fa-circle-notch fa-spin ml-2 hidden"></i>
                    </button>
                </div>
                
                <!-- Delete Button Container (Only in Edit mode) -->
                <div id="deleteBtnContainer" class="mt-3 hidden">
                    <button type="button" onclick="deleteRecord()" class="w-full bg-white text-red-600 border border-red-200 font-semibold py-2 rounded-lg shadow-sm hover:bg-red-50 focus:outline-none flex justify-center items-center transition-colors">
                        <i class="fas fa-trash-alt mr-2"></i> 刪除紀錄
                    </button>
                </div>

                <!-- View Mode Buttons -->
                <div id="downloadButtonsContainer" class="hidden flex space-x-2">
                    <button type="button" onclick="downloadPhotos()" class="flex-1 bg-white text-blue-600 border border-blue-600 font-bold py-2 rounded-lg hover:bg-blue-50 focus:outline-none text-sm">下載照片</button>
                    <button type="button" onclick="downloadRecordText()" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 focus:outline-none text-sm">下載紀錄</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        let records = [];
        const STORAGE_KEY = 'inspection_records_data';
        
        // 1. 最新 API 端點更新
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsdSn-gLMQ2mlK00l4QvBu7OXR9u6WjlFCzucmR1LAW2RTYvBkZuuyHRmq9FnIrvTLRA/exec';

        const state = {
            appMode: 'add', // 'add', 'edit', 'view'
            viewMode: 'month', // 'month', 'week'
            currentDate: new Date()
        };

        const currentPhotos = []; // Store base64 strings
        const el = {};

        // 初始化
        window.onload = function() {
            cacheDOM();
            loadRecordsFromLocal();
            renderCalendar();
            
            // 開機自動從雲端同步歷史資料
            fetchDataFromCloud();
        };

        function cacheDOM() {
            const ids = ['sidebar', 'sidebarOverlay', 'mainHeader', 'modeIndicator', 'currentMonthLabel', 
                         'calendarContainer', 'dataModal', 'modalTitle', 'modalHeader', 'recordForm',
                         'fieldA_select', 'fieldA_custom_container', 'fieldA_date', 'fieldB_time',
                         'fieldC_item', 'fieldD_location', 'fieldE_photo', 'photoPreviewContainer',
                         'fieldF_contractor', 'fieldG_inspector', 'actionButtonsContainer', 'downloadButtonsContainer',
                         'btnSubmit', 'btnSubmitText', 'btnSubmitLoader', 'editBadgeContainer',
                         'btnMonthView', 'btnWeekView', 'syncStatus', 'btnNow', 'deleteBtnContainer'];
            ids.forEach(id => el[id] = document.getElementById(id));
        }

        function loadRecordsFromLocal() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    records = JSON.parse(data);
                } catch(e) {
                    records = [];
                }
            }
        }

        function saveRecordsToLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }
        
        async function fetchDataFromCloud() {
            try {
                // 使用 GET 請求撈取資料，加上 redirect: 'follow' 確保跟隨 Google 的轉址
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });
                if (!response.ok) throw new Error('Network response was not ok');
                const result = await response.json();
                
                if (result.status === 'success' && result.records) {
                    // 合併雲端與本地資料 (以雲端為主)
                    const cloudRecords = result.records;
                    const mergedRecords = [...records];
                    
                    cloudRecords.forEach(cr => {
                        const existingIdx = mergedRecords.findIndex(r => r.id === cr.id);
                        if (existingIdx >= 0) {
                            // Update existing
                            mergedRecords[existingIdx] = {...mergedRecords[existingIdx], ...cr};
                        } else {
                            // Add new
                            mergedRecords.push(cr);
                        }
                    });
                    
                    records = mergedRecords;
                    saveRecordsToLocal();
                    renderCalendar();
                    
                    // Show sync indicator briefly
                    el.syncStatus.classList.remove('hidden');
                    setTimeout(() => el.syncStatus.classList.add('hidden'), 3000);
                }
            } catch (error) {
                console.warn("⚠️ 預覽環境或跨網域限制，無法同步雲端資料。發佈至 Netlify 後即可正常運作。錯誤細節:", error.message);
                // 忽略錯誤，容許離線使用本地資料
            }
        }

        window.toggleSidebar = function() {
            const isOpen = !el.sidebar.classList.contains('-translate-x-full');
            if (isOpen) {
                el.sidebar.classList.add('-translate-x-full');
                el.sidebarOverlay.classList.add('hidden');
            } else {
                el.sidebar.classList.remove('-translate-x-full');
                el.sidebarOverlay.classList.remove('hidden');
            }
        };

        window.setMode = function(mode) {
            state.appMode = mode;
            toggleSidebar();
            
            // 4. 不同模式更新標題列顏色與文字
            el.mainHeader.classList.remove('bg-blue-600', 'bg-orange-600', 'bg-green-600');
            el.modalHeader.classList.remove('bg-blue-600', 'bg-orange-600', 'bg-green-600');
            el.btnSubmit.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'bg-orange-600', 'hover:bg-orange-700');
            
            if (mode === 'add') {
                el.modeIndicator.innerText = '目前模式: 廠商登錄查驗';
                el.mainHeader.classList.add('bg-blue-600');
                el.modalHeader.classList.add('bg-blue-600');
                el.btnSubmit.classList.add('bg-blue-600', 'hover:bg-blue-700');
            } else if (mode === 'edit') {
                el.modeIndicator.innerText = '目前模式: 監造資料登錄 / 修改';
                el.mainHeader.classList.add('bg-orange-600');
                el.modalHeader.classList.add('bg-orange-600');
                el.btnSubmit.classList.add('bg-orange-600', 'hover:bg-orange-700');
            } else if (mode === 'view') {
                el.modeIndicator.innerText = '目前模式: 查驗紀錄總覽';
                el.mainHeader.classList.add('bg-green-600');
                el.modalHeader.classList.add('bg-green-600');
            }
            
            renderCalendar();
        };

        window.switchView = function(view) {
            state.viewMode = view;
            
            if (view === 'month') {
                el.btnMonthView.className = "px-3 py-1 rounded-md text-sm font-medium bg-white text-blue-600 shadow-sm transition-colors";
                el.btnWeekView.className = "px-3 py-1 rounded-md text-sm font-medium text-white hover:bg-white hover:bg-opacity-20 transition-colors";
            } else {
                el.btnWeekView.className = "px-3 py-1 rounded-md text-sm font-medium bg-white text-blue-600 shadow-sm transition-colors";
                el.btnMonthView.className = "px-3 py-1 rounded-md text-sm font-medium text-white hover:bg-white hover:bg-opacity-20 transition-colors";
            }
            
            renderCalendar();
        };

        window.changeDateOffset = function(delta) {
            if(state.viewMode === 'month') {
                state.currentDate.setMonth(state.currentDate.getMonth() + delta);
            } else {
                state.currentDate.setDate(state.currentDate.getDate() + (delta * 7));
            }
            renderCalendar();
        }

        window.handleEventClick = function(event, id) {
            event.stopPropagation();
            if (state.appMode === 'add') {
                // 4. 修改提示詞
                alert('請於 監造查驗資料登錄 作更動時間或填寫紀錄。');
                return;
            }
            
            const record = records.find(r => r.id === id);
            if (record) openModal(record);
        };

        function openModal(existingData = null) {
            resetForm();
            currentPhotos.length = 0;
            
            if (state.appMode === 'add' && !existingData) {
                el.modalTitle.innerText = '登錄查驗 (建議前一天登錄)';
                el.btnSubmitText.innerText = '完成上傳';
                el.recordId.value = '';
                el.isFromCloud.value = 'false';
                el.oldFolderName.value = '';
                lockFieldsForAddMode();
            } else if (state.appMode === 'edit' && existingData) {
                el.modalTitle.innerText = '監造資料登錄 / 修改';
                el.btnSubmitText.innerText = '儲存修改';
                el.deleteBtnContainer.classList.remove('hidden');
                populateForm(existingData);
                // 儲存原始資料夾名稱供重新命名或刪除使用
                el.oldFolderName.value = `${existingData.date.replace(/\//g, '')}_${existingData.item}`;
            } else if (state.appMode === 'view' && existingData) {
                el.modalTitle.innerText = '檢視查驗紀錄';
                el.actionButtonsContainer.classList.add('hidden');
                el.downloadButtonsContainer.classList.remove('hidden');
                populateForm(existingData);
                lockAllFields();
            }
            
            el.dataModal.classList.remove('hidden');
        }

        window.closeModal = function() {
            el.dataModal.classList.add('hidden');
        };

        function resetForm() {
            el.form = document.getElementById('recordForm');
            el.form.reset();
            el.fieldA_custom_container.classList.add('hidden');
            el.editBadgeContainer.innerHTML = '';
            el.photoPreviewContainer.innerHTML = '';
            
            Array.from(el.form.elements).forEach(inp => {
                if(inp.id !== 'btnNow') {
                    inp.disabled = false;
                    inp.classList.remove('bg-gray-100', 'cursor-not-allowed');
                }
            });
            el.btnNow.disabled = false;
            
            el.actionButtonsContainer.classList.remove('hidden');
            el.downloadButtonsContainer.classList.add('hidden');
            el.deleteBtnContainer.classList.add('hidden');
        }

        window.setNowTime = function() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            el.fieldB_time.value = `${h}:${m}`;
        };

        function lockFieldsForAddMode() {
            const fieldsToLock = [el.fieldE_photo, el.fieldF_contractor, el.fieldG_inspector];
            fieldsToLock.forEach(f => {
                f.disabled = true;
                f.classList.add('bg-gray-100', 'cursor-not-allowed');
            });
            document.getElementById('photoReqStar').classList.add('hidden');
            document.getElementById('contractorReqStar').classList.add('hidden');
            document.getElementById('inspectorReqStar').classList.add('hidden');
            
            // Remove 'today' restriction on lock/unlock dynamically
        }

        function unlockFieldsForAddMode() {
            const fieldsToLock = [el.fieldE_photo, el.fieldF_contractor, el.fieldG_inspector];
            fieldsToLock.forEach(f => {
                f.disabled = false;
                f.classList.remove('bg-gray-100', 'cursor-not-allowed');
            });
            document.getElementById('photoReqStar').classList.remove('hidden');
            document.getElementById('contractorReqStar').classList.remove('hidden');
            document.getElementById('inspectorReqStar').classList.remove('hidden');
        }

        window.handleDateSelectChange = function() {
            const val = el.fieldA_select.value;
            const today = new Date();
            let targetDate = new Date();
            
            if (val === 'tomorrow') {
                targetDate.setDate(today.getDate() + 1);
                el.fieldA_custom_container.classList.add('hidden');
                el.fieldA_date.value = formatDateDash(targetDate);
                if(state.appMode === 'add') lockFieldsForAddMode();
            } else if (val === 'today') {
                el.fieldA_custom_container.classList.add('hidden');
                el.fieldA_date.value = formatDateDash(today);
                if(state.appMode === 'add') unlockFieldsForAddMode();
            } else if (val === 'custom') {
                el.fieldA_custom_container.classList.remove('hidden');
                if(state.appMode === 'add') lockFieldsForAddMode();
                el.fieldA_date.value = '';
            } else {
                el.fieldA_custom_container.classList.add('hidden');
                el.fieldA_date.value = '';
                if(state.appMode === 'add') lockFieldsForAddMode();
            }
        };

        window.handlePhotoUpload = function(event) {
            const files = event.target.files;
            if (files.length + currentPhotos.length > 4) {
                alert('最多只能放置四張照片');
                el.fieldE_photo.value = '';
                return;
            }

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Str = e.target.result;
                    currentPhotos.push(base64Str);
                    renderPhotoPreview();
                };
                reader.readAsDataURL(file);
            });
        };

        function renderPhotoPreview() {
            el.photoPreviewContainer.innerHTML = '';
            const selectedDate = el.fieldA_date.value ? formatDateSlash(new Date(el.fieldA_date.value)) : formatDateSlash(new Date());

            currentPhotos.forEach((photoSrc, index) => {
                const div = document.createElement('div');
                div.className = 'relative border rounded-md overflow-hidden aspect-video bg-black flex items-center justify-center';
                
                const img = document.createElement('img');
                img.src = photoSrc;
                img.className = 'max-h-full max-w-full object-contain';
                
                const watermark = document.createElement('div');
                watermark.className = 'absolute bottom-1 right-1 text-yellow-400 text-[10px] font-bold drop-shadow-md bg-black bg-opacity-30 px-1 rounded';
                watermark.innerText = selectedDate;

                div.appendChild(img);
                div.appendChild(watermark);
                
                if (state.appMode !== 'view') {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-80 hover:opacity-100';
                    delBtn.innerHTML = '<i class="fas fa-times"></i>';
                    delBtn.onclick = () => {
                        currentPhotos.splice(index, 1);
                        renderPhotoPreview();
                    };
                    div.appendChild(delBtn);
                }

                el.photoPreviewContainer.appendChild(div);
            });
        }

        function populateForm(data) {
            el.recordId.value = data.id;
            el.isFromCloud.value = data.isFromCloud || false;
            
            // Set custom date select
            el.fieldA_select.value = 'custom';
            el.fieldA_custom_container.classList.remove('hidden');
            el.fieldA_date.value = data.date ? data.date.replace(/\//g, '-') : '';
            
            el.fieldB_time.value = data.time || '';
            el.fieldC_item.value = data.item || '';
            el.fieldD_location.value = data.location || '';
            el.fieldF_contractor.value = data.contractor || '';
            el.fieldG_inspector.value = data.supervisor || '';
            
            if (data.photos && Array.isArray(data.photos)) {
                data.photos.forEach(p => currentPhotos.push(p));
                renderPhotoPreview();
            }

            if (data.isEdited && state.appMode === 'edit') {
                el.editBadgeContainer.classList.remove('hidden');
                el.editBadgeContainer.innerHTML = '<span class="bg-yellow-100 text-yellow-800 text-xs font-semibold px-2 py-1 rounded">已編輯</span>';
            }
            
            unlockFieldsForAddMode();
        }

        function lockAllFields() {
            Array.from(el.form.elements).forEach(inp => {
                inp.disabled = true;
                inp.classList.add('bg-gray-50');
            });
            el.btnNow.disabled = true;
        }

        window.saveRecord = async function() {
            // Validation
            if (!el.fieldA_date.value) { alert('請選擇查驗日期'); return; }
            if (!el.fieldB_time.value) { alert('請選擇查驗時間'); return; }
            if (!el.fieldC_item.value.trim()) { alert('請填寫查驗項目'); return; }
            
            // Mode specific validation
            if (!el.fieldF_contractor.disabled) {
                if (currentPhotos.length === 0 && el.isFromCloud.value !== 'true') { alert('請上傳至少一張查驗照片'); return; }
                if (!el.fieldF_contractor.value.trim()) { alert('請填寫施工廠商'); return; }
                if (!el.fieldG_inspector.value.trim()) { alert('請填寫現場查驗監造'); return; }
            }

            const isEdit = !!el.recordId.value;
            const newId = isEdit ? el.recordId.value : 'rec_' + Date.now();
            const recordDate = formatDateSlash(new Date(el.fieldA_date.value));

            const recordData = {
                id: newId,
                date: recordDate,
                time: el.fieldB_time.value,
                item: el.fieldC_item.value.trim(),
                location: el.fieldD_location.value.trim(),
                contractor: !el.fieldF_contractor.disabled ? el.fieldF_contractor.value.trim() : '',
                supervisor: !el.fieldG_inspector.disabled ? el.fieldG_inspector.value.trim() : '',
                photos: [...currentPhotos],
                isEdited: isEdit,
                isFromCloud: el.isFromCloud.value === 'true'
            };

            // 1. Save to local first for immediate UI feedback
            if (isEdit) {
                const idx = records.findIndex(r => r.id === newId);
                if (idx !== -1) records[idx] = recordData;
            } else {
                records.push(recordData);
            }
            saveRecordsToLocal();
            renderCalendar();

            // 2. Background sync to Google Drive via GAS
            el.btnSubmit.disabled = true;
            el.btnSubmitText.innerText = "雲端同步中...";
            el.btnSubmitLoader.classList.remove('hidden');

            try {
                const payload = {
                    action: 'save',
                    oldFolderName: el.oldFolderName.value, // 【需求6】傳送舊檔名供重新命名用
                    date: recordData.date,
                    time: recordData.time,
                    item: recordData.item,
                    location: recordData.location,
                    contractor: recordData.contractor,
                    inspector: recordData.supervisor,
                    images: recordData.photos
                };

                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    redirect: 'follow', // 確保跟隨 GAS 的重新導向
                    body: JSON.stringify(payload)
                });
                
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch(e) {
                    console.error("Parse error, raw response:", responseText);
                    throw new Error("無法解析伺服器回應");
                }

                if (result.status === 'success') {
                    // Update local record to mark it as synced
                    const idx = records.findIndex(r => r.id === newId);
                    if (idx !== -1) {
                        records[idx].isFromCloud = true;
                        saveRecordsToLocal();
                        renderCalendar();
                    }
                    closeModal();
                } else {
                    alert("雲端同步失敗：" + result.message);
                }
            } catch (error) {
                console.error('Upload Error:', error);
                alert("本機已儲存，但上傳雲端發生錯誤。請確認網路狀態與權限。");
                closeModal(); // 允許使用者關閉視窗，因為本地已儲存
            } finally {
                el.btnSubmit.disabled = false;
                el.btnSubmitText.innerText = state.appMode === 'add' ? "完成上傳" : "儲存修改";
                el.btnSubmitLoader.classList.add('hidden');
            }
        };

        window.deleteRecord = async function() {
            // 【需求5】改用按鈕防呆確認
            if(!confirm("確定要刪除這筆紀錄嗎？\n資料將會被移至雲端的「已刪除」資料夾。")) {
                return;
            }

            const id = el.recordId.value;
            const oldName = el.oldFolderName.value;

            // 1. Local delete
            records = records.filter(r => r.id !== id);
            saveRecordsToLocal();
            renderCalendar();
            closeModal();

            // 2. Cloud delete (Move to Trash)
            if (oldName) {
                try {
                    const payload = { action: 'delete', oldFolderName: oldName };
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        redirect: 'follow',
                        body: JSON.stringify(payload)
                    });
                    // Fire and forget, local UI is already updated
                } catch(e) {
                    console.warn("⚠️ 刪除同步失敗 (預覽環境限制):", e);
                }
            }
        };

        window.downloadPhotos = function() {
            if (currentPhotos.length === 0) {
                alert('沒有照片可以下載。');
                return;
            }
            
            const zip = new JSZip();
            const dateStr = el.fieldA_date.value.replace(/-/g, '');
            const folderName = `${dateStr}_${el.fieldC_item.value}`;
            
            currentPhotos.forEach((base64, index) => {
                const base64Data = base64.split(',')[1];
                zip.file(`照片_${index+1}.jpg`, base64Data, {base64: true});
            });

            zip.generateAsync({type:"blob"}).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `${folderName}_照片.zip`;
                link.click();
            });
        };

        window.downloadRecordText = function() {
            const dateStr = el.fieldA_date.value.replace(/-/g, '');
            const folderName = `${dateStr}_${el.fieldC_item.value}`;
            
            const textContent = `【查驗日期】: ${el.fieldA_date.value.replace(/-/g, '/')}\n` +
                                `【查驗時間】: ${el.fieldB_time.value}\n` +
                                `【查驗項目】: ${el.fieldC_item.value}\n` +
                                `【查驗地點】: ${el.fieldD_location.value}\n` +
                                `【施工廠商】: ${el.fieldF_contractor.value}\n` +
                                `【查驗監造】: ${el.fieldG_inspector.value}\n`;
            
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${folderName}_紀錄.txt`;
            link.click();
        };

        function renderCalendar() {
            if (state.viewMode === 'month') {
                renderMonthView();
            } else {
                renderWeekView();
            }
        }

        function renderMonthView() {
            const year = state.currentDate.getFullYear();
            const month = state.currentDate.getMonth();
            el.currentMonthLabel.innerText = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - startDate.getDay());
            
            const endDate = new Date(lastDay);
            if (endDate.getDay() !== 6) {
                endDate.setDate(endDate.getDate() + (6 - endDate.getDay()));
            }

            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            
            // 加入 overflow-x-auto 讓手機版格線固定不擠壓
            let html = `<div class="flex-1 overflow-x-auto no-scrollbar"><div class="min-w-[700px] h-full flex flex-col">`;
            
            // Header
            html += `<div class="grid grid-cols-7 gap-[1px] bg-gray-200 text-center text-sm font-semibold text-gray-600 py-2">`;
            dayNames.forEach(d => html += `<div>${d}</div>`);
            html += `</div>`;

            // Body
            html += `<div class="calendar-grid flex-1">`;
            
            let curr = new Date(startDate);
            const todayStr = new Date().toDateString();

            while (curr <= endDate) {
                const isOtherMonth = curr.getMonth() !== month;
                const isToday = curr.toDateString() === todayStr;
                html += generateCellHtml(new Date(curr), isOtherMonth, isToday);
                curr.setDate(curr.getDate() + 1);
            }
            
            html += `</div></div></div>`;
            el.calendarContainer.innerHTML = html;
        }

        function renderWeekView() {
            const startOfWeek = getStartOfWeek(state.currentDate);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);
            
            const formatShortDate = (d) => `${d.getMonth()+1}/${d.getDate()}`;
            el.currentMonthLabel.innerText = `${formatShortDate(startOfWeek)} - ${formatShortDate(endOfWeek)}`;

            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            
            // 【需求3】加寬 min-w-[1000px] 讓手機可左右滑動且格線寬大
            let html = `<div class="flex-1 overflow-x-auto no-scrollbar relative w-full"><div class="min-w-[1000px] flex flex-col min-h-full">`;
            
            // Header
            html += `<div class="week-header-grid text-sm font-semibold text-gray-600 text-center py-2 sticky top-0 z-20 shadow-sm bg-gray-50 border-b border-gray-300">
                <div class="bg-gray-50 flex items-center justify-center">時間</div>`;
            for(let i=0; i<7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(d.getDate() + i);
                const isToday = d.toDateString() === new Date().toDateString();
                html += `<div class="bg-gray-50 flex flex-col items-center justify-center ${isToday ? 'text-blue-600 font-bold' : ''}">
                    <span>${dayNames[i]}</span>
                    <span class="text-xs">(${formatShortDate(d)})</span>
                </div>`;
            }
            html += `</div>`;

            // Body
            html += `<div class="week-body-grid flex-1 relative">`;
            
            // Create time axis
            html += `<div class="flex flex-col bg-white border-r border-gray-200">`;
            for(let h=0; h<24; h++) {
                html += `<div class="time-axis-cell">${String(h).padStart(2,'0')}:00</div>`;
            }
            html += `</div>`;

            // Create 7 columns for days
            for(let i=0; i<7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(d.getDate() + i);
                const dateStr = formatDate(d);
                const dayEvents = records.filter(r => r.date === dateStr);
                
                html += `<div class="week-day-col border-r border-gray-100">`;
                
                // Render 24 empty slots for visual grid
                for(let h=0; h<24; h++) {
                    html += `<div class="hour-slot"></div>`;
                }
                
                // 【需求3】碰撞偵測與寬度均分演算法
                const timeGroups = {};
                dayEvents.forEach(ev => {
                    // 取小時作為分組依據 (粗略碰撞)
                    const hourPrefix = ev.time.split(':')[0]; 
                    if (!timeGroups[hourPrefix]) timeGroups[hourPrefix] = [];
                    timeGroups[hourPrefix].push(ev);
                });

                Object.keys(timeGroups).forEach(hourKey => {
                    const group = timeGroups[hourKey];
                    const count = group.length; // 該時段有幾個重疊行程
                    
                    group.forEach((ev, idx) => {
                        const timeParts = ev.time.split(':');
                        let topOffset = 0;
                        if(timeParts.length === 2 && !isNaN(timeParts[0])) {
                            const hours = parseInt(timeParts[0]);
                            const mins = parseInt(timeParts[1]);
                            topOffset = (hours * 60) + mins;
                        }
                        
                        const isComplete = ev.contractor && ev.supervisor && (ev.photos?.length > 0 || ev.isFromCloud);
                        const badgeClass = ev.isFromCloud ? 'cloud-synced' : (isComplete ? 'mode-view' : 'bg-gray-100 text-gray-700 border-l-2 border-gray-400');
                        
                        // 計算並排寬度 (留一點 margin 避免黏死)
                        const widthPct = 100 / count;
                        const leftPct = idx * widthPct;
                        
                        html += `
                            <div class="event-badge ${badgeClass} shadow-md absolute z-10 p-1 border border-white" 
                                 style="top: ${topOffset}px; left: calc(${leftPct}%); width: calc(${widthPct}% - 2px);" 
                                 onclick="handleEventClick(event, '${ev.id}')" title="${ev.time} - ${ev.item}">
                                <div class="font-bold text-[10px] leading-tight">${ev.time}</div>
                                <div class="truncate text-xs font-semibold leading-tight mt-0.5">${ev.item}</div>
                                <div class="truncate text-[10px] opacity-80 leading-tight mt-0.5">${ev.contractor || ''}</div>
                            </div>
                        `;
                    });
                });
                
                html += `</div>`;
            }
            
            html += `</div></div></div>`;
            el.calendarContainer.innerHTML = html;
        }

        function generateCellHtml(cellDate, isOtherMonth, isToday = false) {
            const dateStr = formatDate(cellDate);
            const dayEvents = records.filter(r => r.date === dateStr);
            
            // Sort by time
            dayEvents.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            
            let classes = "calendar-cell flex flex-col";
            if(isOtherMonth) classes += " other-month";
            if(isToday) classes += " today";

            let html = `<div class="${classes}" onclick="if('${state.appMode}' === 'add') { openModal(); document.getElementById('fieldA_select').value='custom'; document.getElementById('fieldA_custom_container').classList.remove('hidden'); document.getElementById('fieldA_date').value='${formatDateDash(cellDate)}'; }">
                <div class="text-right text-sm font-semibold mb-1 ${isToday ? 'text-blue-600' : ''}">${cellDate.getDate()}</div>
                <div class="flex-1 space-y-1 overflow-y-auto no-scrollbar">`;
            
            dayEvents.forEach(ev => {
                const isComplete = ev.contractor && ev.supervisor && (ev.photos?.length > 0 || ev.isFromCloud);
                // 雲端資料綠色，完整填寫藍色，草稿灰色
                const badgeClass = ev.isFromCloud ? 'cloud-synced' : (isComplete ? 'mode-view' : 'bg-gray-100 text-gray-700 border-l-2 border-gray-400');
                
                html += `<div class="event-badge ${badgeClass}" onclick="handleEventClick(event, '${ev.id}')" title="${ev.item}">
                    <span class="font-bold">${ev.time}</span> ${ev.item} ${ev.isEdited ? '<span class="text-orange-500 font-bold">(編)</span>' : ''}
                </div>`;
            });
            
            html += `</div></div>`;
            return html;
        }

        function formatDate(d) {
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        }
        function formatDateSlash(d) {
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        }
        function formatDateDash(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function getStartOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day;
            return new Date(d.setDate(diff));
        }
    </script>
</body>
</html>
